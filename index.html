<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - MULTI-DEVICE</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">

    <style>
        :root { --accent: #e50914; --gold: #ffcc00; --bg: #050505; }
        
        body { 
            background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; padding-bottom: 50px; overflow-x: hidden;
            -webkit-user-select: none; user-select: none;
        }

        /* --- NAVIGATION HYBRIDE (TV & MOBILE) --- */
        [tabindex="0"] { outline: none; transition: transform 0.2s; cursor: pointer; }
        [tabindex="0"]:focus {
            outline: 3px solid white !important;
            transform: scale(1.08);
            z-index: 100;
            background: rgba(255,255,255,0.1);
        }

        /* --- HEADER ADAPTATIF --- */
        header { 
            position: fixed; top: 0; width: 100%; height: 70px; 
            background: rgba(0,0,0,0.9); display: flex; align-items: center; 
            padding: 0 4%; z-index: 2000; justify-content: space-between; box-sizing: border-box;
        }
        .nav-links { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-btn { background: none; border: none; color: #bbb; font-size: 16px; font-weight: bold; white-space: nowrap; padding: 10px; }
        .nav-btn.active { color: white; border-bottom: 3px solid var(--accent); }

        /* --- GRILLE DE CONTENU --- */
        #main-content { padding-top: 80px; }
        .category-row { margin-bottom: 25px; }
        .category-title { font-size: 20px; font-weight: bold; margin: 15px 4%; color: #fff; text-transform: uppercase; }
        .carousel { 
            display: flex; overflow-x: auto; gap: 15px; padding: 10px 4%; 
            scrollbar-width: none; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; 
        }
        .carousel::-webkit-scrollbar { display: none; }

        /* Cartes Multi-Format */
        .card { flex: 0 0 160px; width: 160px; position: relative; }
        .card img { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; background: #222; }
        .card.landscape { flex: 0 0 280px; width: 280px; }
        .card.landscape img { height: 160px; object-fit: cover; }
        .card-name { margin-top: 8px; font-size: 14px; text-align: center; color: #bbb; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        /* Progress Bar */
        .prog-bg { position: absolute; bottom: 35px; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; }
        .prog-fill { height: 100%; background: var(--accent); }

        /* --- DETAILS OVERLAY (FULLSCREEN TV/MOBILE) --- */
        #details-overlay {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 3500; display: none; flex-direction: column; overflow-y: auto;
        }
        .details-hero { height: 50vh; width: 100%; position: relative; }
        #details-header-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: 0.5s; }
        .details-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 20%, transparent); }
        .details-info { padding: 0 5%; margin-top: -100px; position: relative; z-index: 5; }
        .details-info h2 { font-size: clamp(30px, 5vw, 60px); margin: 0; }
        .meta { color: #888; margin: 15px 0; display: flex; gap: 20px; font-size: 16px; align-items: center; }
        .synopsis { color: #ddd; line-height: 1.6; font-size: 18px; max-width: 900px; margin-bottom: 30px; }
        
        .details-actions { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn-play { background: white; color: black; border: none; padding: 15px 40px; border-radius: 5px; font-weight: bold; font-size: 18px; }
        .btn-sec { background: rgba(255,255,255,0.1); color: white; border: 1px solid #444; padding: 15px 25px; border-radius: 5px; }

        /* Casting & Suggestions */
        .section-label { font-size: 18px; font-weight: bold; margin: 30px 0 15px; border-left: 4px solid var(--accent); padding-left: 10px; }
        .cast-row { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .actor-item { flex: 0 0 100px; text-align: center; }
        .actor-item img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        .actor-name { font-size: 12px; color: #aaa; margin-top: 5px; }

        /* --- LECTEUR --- */
        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
        .video-js { width: 100% !important; height: 100% !important; }

        /* --- LOGIN & PROFILES --- */
        #login-screen, #profile-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { width: 90%; max-width: 400px; text-align: center; }
        .login-box input { width: 100%; padding: 15px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 5px; font-size: 18px; }
        
        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .profile-avatar { width: 120px; height: 120px; background: #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 50px; }

        #expiration-banner { position: fixed; top: 70px; width: 100%; background: var(--gold); color: #000; text-align: center; padding: 10px; font-weight: bold; z-index: 1900; display: none; }

        @media (min-width: 1024px) { /* Optimisations Desktop / TV */
            .card { flex: 0 0 200px; width: 200px; }
            .card img { height: 300px; }
            .category-title { font-size: 26px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="login-screen">
    <div class="login-box">
        <h1 style="color:var(--accent)">SFPP ELITE</h1>
        <input type="email" id="user" placeholder="E-mail" tabindex="0">
        <input type="password" id="pass" placeholder="Mot de passe" tabindex="0">
        <button class="btn-play" style="width:100%" onclick="checkLogin()" tabindex="0">CONNEXION</button>
    </div>
</div>

<div id="profile-screen" style="display:none">
    <h1>Qui regarde ?</h1>
    <div class="profile-grid" id="profile-list"></div>
    <button onclick="logout()" style="margin-top:40px; color:#666; background:none; border:none;" tabindex="0">DÉCONNEXION</button>
</div>

<header id="app-header" style="display:none">
    <div style="color:var(--accent); font-weight:900; font-size: 22px;">SFPP <span id="header-validity" style="font-size:10px; color:#666"></span></div>
    <div class="nav-links">
        <button class="nav-btn active" id="btn-all" onclick="changeView('all')" tabindex="0">Accueil</button>
        <button class="nav-btn" id="btn-movies" onclick="changeView('movies')" tabindex="0">Films</button>
        <button class="nav-btn" id="btn-series" onclick="changeView('series')" tabindex="0">Séries</button>
        <button class="nav-btn" id="btn-fav" onclick="changeView('fav')" tabindex="0">Ma Liste</button>
    </div>
    <button class="nav-btn" onclick="switchProfile()" tabindex="0">👤</button>
</header>

<div id="expiration-banner"></div>

<main id="main-content" style="display:none">
    <div id="categories-container"></div>
</main>

<div id="details-overlay">
    <button onclick="closeDetails()" style="position:absolute; top:20px; right:20px; z-index:100; background:rgba(0,0,0,0.5); border:none; color:white; font-size:30px; border-radius:50%; width:50px; height:50px;" tabindex="0">✕</button>
    <div class="details-hero"><div id="details-header-bg"></div></div>
    <div class="details-info">
        <h2 id="details-title">Titre</h2>
        <div class="meta">
            <span id="details-year">2024</span>
            <span id="details-stars" style="color:var(--gold)"></span>
            <span id="details-cat">Action</span>
        </div>
        <p id="details-desc" class="synopsis"></p>
        <div class="details-actions">
            <button id="details-play-btn" class="btn-play" tabindex="0">▶ Lancer</button>
            <button id="details-fav-btn" class="btn-sec" tabindex="0">+ Ma Liste</button>
            <button id="details-report-btn" class="btn-sec" tabindex="0">⚠️ Signaler</button>
        </div>
        <div class="section-label">Casting</div>
        <div id="details-cast" class="cast-row"></div>
        <div class="section-label">Bande-annonce</div>
        <div id="details-trailer" style="width:100%; max-width:600px; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden"></div>
    </div>
</div>

<section id="player-section">
    <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="auto"></video>
</section>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDipnvk8nHn_mnj6HObA038DhS2U39kSgU",
      authDomain: "sfpp-elite.firebaseapp.com",
      databaseURL: "https://sfpp-elite-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sfpp-elite"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // --- AUTHENTIFICATION & VALIDITÉ ---
    window.checkLogin = function() {
        const email = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Erreur: " + e.message));
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const snap = await get(ref(db, 'users_data/' + user.uid + '/expire'));
            const expireDate = snap.val();
            
            // Vérification expiration immédiate
            if (expireDate && new Date() > new Date(expireDate)) {
                alert("Compte expiré le " + expireDate);
                signOut(auth);
                return;
            }

            // Affichage bannière préventive
            if (expireDate) {
                const diff = Math.ceil((new Date(expireDate) - new Date()) / (1000*60*60*24));
                document.getElementById('header-validity').innerText = `(Expire: ${expireDate})`;
                if (diff <= 5) {
                    const b = document.getElementById('expiration-banner');
                    b.style.display = 'block';
                    b.innerText = `⚠️ Votre accès expire dans ${diff} jour(s).`;
                }
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('profile-screen').style.display = 'flex';
            initProfiles();
            loadPlaylist();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.reportFilm = (title) => {
        if(confirm(`Signaler "${title}" comme HS ?`)) {
            push(ref(db, 'signalements'), {
                film: title,
                date: new Date().toLocaleString(),
                user: currentProfile
            }).then(() => alert("Signalement envoyé."));
        }
    };

    window.logout = () => signOut(auth).then(() => location.reload());
</script>

<script>
let player, playlistData = [], currentProfile = null, currentView = 'all';
const TMDB_KEY = "ec1c8fecd38d1cc5a27f15766f0848d5";

// --- NAVIGATION CLAVIER/TÉLÉCOMMANDE ---
document.addEventListener('keydown', (e) => {
    if (e.keyCode === 13 && document.activeElement) document.activeElement.click(); // OK
    if (e.keyCode === 8 || e.keyCode === 27) { // BACK / ECHAP
        e.preventDefault();
        if (document.getElementById('player-section').style.display === 'block') closeP();
        else if (document.getElementById('details-overlay').style.display === 'flex') closeDetails();
    }
});

// --- CHARGEMENT DONNÉES & TMDB ---
async function loadPlaylist() {
    const res = await fetch('films.json?v=' + Date.now());
    const data = await res.json();
    
    // Enrichissement TMDB dynamique (comme ton code original)
    const promises = data.map(async (m) => {
        if (m.id_tmdb) {
            try {
                const tr = await fetch(`https://api.themoviedb.org/3/movie/${m.id_tmdb}?api_key=${TMDB_KEY}&language=fr-FR&append_to_response=videos,credits`);
                const d = await tr.json();
                m.img = m.img || `https://image.tmdb.org/t/p/w500${d.poster_path}`;
                m.bg = m.bg || `https://image.tmdb.org/t/p/original${d.backdrop_path}`;
                m.desc = m.desc || d.overview;
                m.year = m.year || d.release_date?.split('-')[0];
                m.note = m.note || Math.round(d.vote_average / 2);
                m.cast = d.credits?.cast.slice(0, 8).map(a => ({ name: a.name, pic: `https://image.tmdb.org/t/p/w185${a.profile_path}` }));
                if (d.videos?.results.length > 0) m.trailer = d.videos.results[0].key;
            } catch(e) {}
        }
        return m;
    });

    playlistData = await Promise.all(promises);
    render();
}

function render() {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    
    let filtered = playlistData;
    if (currentView === 'movies') filtered = playlistData.filter(m => !m.cat.includes("SÉRIES"));
    if (currentView === 'series') filtered = playlistData.filter(m => m.cat.includes("SÉRIES"));
    if (currentView === 'fav') {
        const f = JSON.parse(localStorage.getItem('fav_' + currentProfile) || "[]");
        filtered = playlistData.filter(m => f.includes(m.t));
    }

    const categories = [...new Set(filtered.map(m => m.cat.split(',')[0].trim()))];

    categories.forEach(cat => {
        const items = filtered.filter(m => m.cat.includes(cat));
        if (items.length === 0) return;

        let html = `<div class="category-row"><div class="category-title">${cat}</div><div class="carousel">`;
        items.forEach(m => {
            const isTV = m.cat.includes("DIRECT");
            const prog = JSON.parse(localStorage.getItem('prog_' + currentProfile) || "{}")[m.t] || 0;
            const pct = prog > 5 ? `<div class="prog-bg"><div class="prog-fill" style="width:${prog}%"></div></div>` : "";
            
            html += `
                <div class="card ${isTV ? 'landscape' : ''}" tabindex="0" onclick="openDetails(${playlistData.indexOf(m)})">
                    <img src="${m.img}" loading="lazy">
                    ${pct}
                    <div class="card-name">${m.t}</div>
                </div>`;
        });
        html += `</div></div>`;
        cont.innerHTML += html;
    });
}

// --- ACTIONS INTERFACE ---
function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('details-header-bg').style.backgroundImage = `url('${m.bg || m.img}')`;
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-desc').innerText = m.desc || "Pas de résumé.";
    document.getElementById('details-year').innerText = m.year || "2024";
    document.getElementById('details-cat').innerText = m.cat;
    
    let stars = ""; for(let i=0; i<5; i++) stars += i < (m.note||5) ? "★" : "☆";
    document.getElementById('details-stars').innerText = stars;

    document.getElementById('details-cast').innerHTML = (m.cast || []).map(a => `
        <div class="actor-item">
            <img src="${a.pic}" onerror="this.src='https://via.placeholder.com/80'">
            <div class="actor-name">${a.name}</div>
        </div>
    `).join('');

    document.getElementById('details-trailer').innerHTML = m.trailer ? `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${m.trailer}" frameborder="0" allowfullscreen></iframe>` : "<p style='padding:20px'>Bande-annonce non disponible</p>";

    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
    document.getElementById('details-report-btn').onclick = () => window.reportFilm(m.t);

    const favBtn = document.getElementById('details-fav-btn');
    let f = JSON.parse(localStorage.getItem('fav_' + currentProfile) || "[]");
    favBtn.innerText = f.includes(m.t) ? "❤️ Retirer" : "+ Ma Liste";
    favBtn.onclick = () => {
        if(f.includes(m.t)) f = f.filter(x => x !== m.t); else f.push(m.t);
        localStorage.setItem('fav_' + currentProfile, JSON.stringify(f));
        openDetails(idx);
    };

    document.getElementById('details-overlay').style.display = 'flex';
    setTimeout(() => document.getElementById('details-play-btn').focus(), 100);
}

function playMovie(idx) {
    const m = playlistData[idx];
    document.getElementById('player-section').style.display = 'block';
    let url = m.url; try { url = window.atob(m.url); } catch(e) {}

    player.src({ src: url, type: url.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
    player.play();
    
    player.on('timeupdate', () => {
        const p = (player.currentTime() / player.duration()) * 100;
        if (p > 5) {
            let storage = JSON.parse(localStorage.getItem('prog_' + currentProfile) || "{}");
            storage[m.t] = p;
            localStorage.setItem('prog_' + currentProfile, JSON.stringify(storage));
        }
    });
}

function closeP() { player.pause(); document.getElementById('player-section').style.display = 'none'; render(); }
function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }

function initProfiles() {
    const profiles = [{n:"Principal", i:"👤"}, {n:"Kids", i:"🐣"}];
    document.getElementById('profile-list').innerHTML = profiles.map(p => `
        <div class="profile-item" onclick="selectProfile('${p.n}')" tabindex="0">
            <div class="profile-avatar">${p.i}</div>
            <div class="profile-name">${p.n}</div>
        </div>
    `).join('');
}

function selectProfile(name) {
    currentProfile = name;
    document.getElementById('profile-screen').style.display = 'none';
    document.getElementById('app-header').style.display = 'flex';
    document.getElementById('main-content').style.display = 'block';
}

function switchProfile() { location.reload(); }
function changeView(v) { 
    currentView = v; 
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-'+v).classList.add('active');
    render();
}

document.addEventListener('DOMContentLoaded', () => {
    player = videojs('main-video');
});
</script>
</body>
</html>
