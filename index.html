<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - VERSION FINALE TV/MOBILE</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">

    <style>
        :root { --accent: #e50914; --gold: #ffcc00; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding-bottom: 50px; -webkit-user-select: none; user-select: none; }
        
        /* NAVIGATION TÉLÉCOMMANDE */
        [tabindex="0"]:focus {
            outline: 3px solid white !important;
            transform: scale(1.05);
            background: rgba(255,255,255,0.1);
            z-index: 100;
        }

        #login-screen, #profile-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: #111; padding: 30px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #333; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }

        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .profile-avatar { width: 100px; height: 100px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid transparent; }

        header { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: rgba(0,0,0,0.95); display: flex; align-items: center; 
            padding: 0 15px; z-index: 2000; border-bottom: 1px solid #222; 
            justify-content: space-between; box-sizing: border-box;
        }
        .logo { color: var(--accent); font-weight: 900; font-size: 18px; }
        .nav-links { display: flex; gap: 15px; flex: 1; overflow-x: auto; white-space: nowrap; scrollbar-width: none; margin-left: 15px; }
        .nav-btn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 13px; font-weight: 500; padding: 10px 5px; border-radius: 4px; }
        .nav-btn.active { color: white; border-bottom: 2px solid var(--accent); }

        #main-content { padding-top: 80px; }
        .category-row { position: relative; width: 100%; margin-bottom: 20px; }
        .category-title { font-size: 18px; font-weight: bold; margin: 20px 4% 10px; color: #fff; text-transform: uppercase; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; padding: 0 4% 10px; scrollbar-width: none; scroll-behavior: smooth; }

        .card { flex: 0 0 150px; width: 150px; cursor: pointer; position: relative; display: flex; flex-direction: column; }
        .card img { width: 150px !important; height: 225px !important; object-fit: cover !important; border-radius: 4px; background: #222; }
        .card.landscape { flex: 0 0 180px; width: 180px; }
        .card.landscape img { height: 110px !important; object-fit: contain !important; background: #111; }
        .card-name { margin-top: 6px; font-size: 12px; text-align: center; color: #bbb; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        #details-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3500; display: none; overflow-y: auto; flex-direction: column; }
        .details-info { padding: 40px 5%; }
        .btn-play-main { background: white; color: black; border: none; padding: 15px 35px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }

        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; }
        .video-container { width: 100%; height: 100%; position: relative; }
        
        .btn-close-player {
            position: absolute; top: 20px; left: 20px; z-index: 5000;
            background: rgba(0,0,0,0.5); border: none; color: white;
            width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer;
        }

        /* IFRAME FULLSCREEN */
        #filemoon-iframe {
            position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 4900; display: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="login-screen">
    <form class="login-box" onsubmit="event.preventDefault(); checkLogin();">
        <div class="logo" style="margin-bottom:20px; font-size: 24px;">SFPP ELITE</div>
        <input type="email" id="user" placeholder="E-mail" required tabindex="0">
        <input type="password" id="pass" placeholder="Mot de passe" required tabindex="0">
        <button type="submit" tabindex="0">CONNEXION</button>
    </form>
</div>

<div id="profile-screen" style="display:none">
    <h1 style="font-size: 28px;">Qui regarde ?</h1>
    <div class="profile-grid" id="profile-list"></div>
    <button onclick="logout()" style="margin-top: 30px; background:none; border:1px solid #333; color:#666; padding:10px; cursor:pointer;" tabindex="0">DÉCONNEXION</button>
</div>

<header id="app-header" style="display:none">
    <div class="logo">SFPP</div>
    <div class="nav-links">
        <button class="nav-btn active" id="btn-all" onclick="changeView('all')" tabindex="0">Accueil</button>
        <button class="nav-btn" id="btn-movies" onclick="changeView('movies')" tabindex="0">Films</button>
        <button class="nav-btn" id="btn-series" onclick="changeView('series')" tabindex="0">Séries</button>
        <button class="nav-btn" onclick="location.reload()" tabindex="0">🔄</button>
    </div>
</header>

<main id="main-content" style="display:none">
    <div id="categories-container"></div>
</main>

<div id="details-overlay">
    <div class="details-info">
        <h2 id="details-title">Titre</h2>
        <p id="details-desc" style="color:#aaa; line-height:1.6;"></p>
        <div class="details-actions">
            <button id="details-play-btn" class="btn-play-main" tabindex="0">▶ LANCER LE FILM</button>
            <button onclick="closeDetails()" class="nav-btn" style="background:#222; color:white; margin-top:20px; padding:15px 30px" tabindex="0">Retour</button>
        </div>
    </div>
</div>

<section id="player-section">
    <button class="btn-close-player" onclick="closeP()" tabindex="0">✕</button>
    <div class="video-container">
        <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="auto" style="width:100%; height:100%"></video>
        <iframe id="filemoon-iframe" allowfullscreen allow="autoplay"></iframe>
    </div>
</section>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDipnvk8nHn_mnj6HObA038DhS2U39kSgU",
      authDomain: "sfpp-elite.firebaseapp.com",
      databaseURL: "https://sfpp-elite-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sfpp-elite"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.checkLogin = () => {
        const e = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, e, p).catch(() => alert("Identifiants incorrects."));
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('profile-screen').style.display = 'flex';
            renderProfiles();
            loadPlaylist();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.logout = () => signOut(auth).then(() => location.reload());

    function renderProfiles() {
        const profs = [{n:"Elite", i:"👤"}, {n:"Kids", i:"🐣"}];
        document.getElementById('profile-list').innerHTML = profs.map(p => `
            <div class="profile-item" onclick="selectProfile('${p.n}')" tabindex="0">
                <div class="profile-avatar">${p.i}</div>
                <div class="profile-name">${p.n}</div>
            </div>`).join('');
    }

    window.selectProfile = (n) => {
        document.getElementById('profile-screen').style.display = 'none';
        document.getElementById('app-header').style.display = 'flex';
        document.getElementById('main-content').style.display = 'block';
    };
</script>

<script>
let player, playlistData = [], currentView = 'all';

async function loadPlaylist() {
    try {
        const response = await fetch('films.json?v=' + Date.now());
        playlistData = await response.json();
        render();
    } catch (e) {}
}

function render() {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    const categories = [...new Set(playlistData.map(m => m.cat.split(',')[0].trim()))];
    categories.forEach(c => {
        const items = playlistData.filter(m => m.cat.includes(c));
        let html = `<div class="category-title">${c}</div><div class="category-row"><div class="carousel">`;
        items.forEach(m => {
            const isTV = m.cat.includes("DIRECT") || m.cat.includes("TV");
            html += `<div class="card ${isTV ? 'landscape' : ''}" tabindex="0" onclick="openDetails(${playlistData.indexOf(m)})">
                <img src="${m.img}" loading="lazy"><div class="card-name">${m.t}</div></div>`;
        });
        cont.innerHTML += html + `</div></div>`;
    });
}

function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-desc').innerText = m.desc || "Aucun résumé disponible.";
    document.getElementById('details-overlay').style.display = 'flex';
    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
    setTimeout(() => document.getElementById('details-play-btn').focus(), 100);
}

function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }

function playMovie(idx) {
    const m = playlistData[idx];
    let url = ""; try { url = window.atob(m.url); } catch(e) { url = m.url; }

    const pSection = document.getElementById('player-section');
    const videoJS = document.getElementById('main-video');
    const iframe = document.getElementById('filemoon-iframe');

    // Reset players
    player.pause();
    iframe.src = "";
    iframe.style.display = "none";
    videoJS.style.display = "none";
    pSection.style.display = "block";

    // DÉTECTION FILEMOON
    if (url.includes("filemoon.org")) {
        iframe.style.display = "block";
        // Transformation automatique en lien embed /e/ pour éviter les blocages
        iframe.src = url.replace("/d/", "/e/").replace("/en/", "/e/");
    } else {
        videoJS.style.display = "block";
        player.src({ src: url, type: url.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
        player.play();
    }
    document.getElementById('details-overlay').style.display = 'none';
}

function closeP() {
    player.pause();
    document.getElementById('filemoon-iframe').src = "";
    document.getElementById('player-section').style.display = 'none';
}

function changeView(v) {
    currentView = v;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-'+v)?.classList.add('active');
    render();
}

document.addEventListener('DOMContentLoaded', () => { 
    player = videojs('main-video'); 

    // Gestion touches télécommande
    document.addEventListener('keydown', (e) => {
        if(e.keyCode === 13 && document.activeElement) document.activeElement.click();
        if(e.keyCode === 8 || e.keyCode === 27) { // Retour / Back
            e.preventDefault();
            if(document.getElementById('player-section').style.display === 'block') closeP();
            else if(document.getElementById('details-overlay').style.display === 'flex') closeDetails();
        }
    });
});
</script>
</body>
</html>
