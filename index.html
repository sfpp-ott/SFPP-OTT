<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - MA LISTE COMPLÈTE</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SFPP ELITE">
    <meta name="theme-color" content="#050505">

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">
    <link href="https://unpkg.com/@silvermine/videojs-chromecast@1.5.0/dist/silvermine-videojs-chromecast.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>

    <style>
        :root { --accent: #e50914; --gold: #ffcc00; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding-bottom: 50px; -webkit-user-select: none; user-select: none; }
        
        [tabindex="0"]:focus { outline: 3px solid white !important; outline-offset: 2px; transform: scale(1.05); background: rgba(255,255,255,0.1); z-index: 100; }

        #login-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #111; padding: 30px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #333; position: relative; z-index: 10000; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-request { background: none !important; border: none; color: #666 !important; font-size: 11px; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        #profile-screen { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 80%; max-width: 400px; margin-top: 30px; }
        .profile-item { text-align: center; cursor: pointer; transition: transform 0.2s; position: relative; border-radius: 8px; }
        .profile-avatar { width: 100px; height: 100px; background: #333; border-radius: 4px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid transparent; }
        .profile-name { font-size: 14px; color: #888; }
        
        .edit-icon { position: absolute; top: 35px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); border-radius: 50%; padding: 5px; display: none; font-size: 20px; }
        .is-editing .edit-icon { display: block; }
        .btn-manage { margin-top: 40px; background: none; border: 1px solid #444; color: #888; padding: 10px 20px; cursor: pointer; font-size: 14px; letter-spacing: 1px; }

        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.95); display: flex; align-items: center; padding: 0 15px; z-index: 2000; border-bottom: 1px solid #222; justify-content: space-between; box-sizing: border-box; gap: 10px; }
        .logo { color: var(--accent); font-weight: 900; font-size: 18px; flex-shrink: 0; }
        .nav-links { display: flex; gap: 15px; flex: 1; overflow-x: auto; white-space: nowrap; align-items: center; scrollbar-width: none; -webkit-overflow-scrolling: touch; justify-content: flex-start; }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-btn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 13px; font-weight: 500; padding: 10px 5px; transition: color 0.3s; flex-shrink: 0; border-radius: 4px; }
        .nav-btn.active { color: white; font-weight: bold; border-bottom: 2px solid var(--accent); }

        #search-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 60px; background: #000; display: none; align-items: center; padding: 0 15px; box-sizing: border-box; z-index: 2001; }
        #searchBar { flex: 1; background: #222; border: 1px solid #444; color: white; padding: 8px 15px; border-radius: 20px; outline: none; font-size: 14px; }
        .header-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .btn-icon { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        .btn-logout { background: #333; color: white; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; flex-shrink: 0; }

        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; overflow: hidden; }
        .video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        
        .vjs-blur-bg { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center; filter: blur(40px) brightness(0.3); transform: scale(1.1); }
        .video-js { z-index: 1 !important; width: 100% !important; height: 100% !important; }
        #clappr-container { position: absolute; inset: 0; z-index: 10; display: none; background: #000; }

        #next-episode-btn { position: absolute; bottom: 85px; right: 25px; z-index: 99999 !important; background: #e50914; color: white; border: 2px solid #fff; padding: 15px 25px; border-radius: 8px; font-weight: bold; font-size: 15px; display: none; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.9); animation: fadeIn 0.5s; }
        .btn-close-player { position: absolute; top: 20px; left: 20px; z-index: 5000; background: rgba(0,0,0,0.5); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer; }

        #details-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3500; display: none; flex-direction: column; overflow-y: auto; }
        .details-content { position: relative; width: 100%; display: block; animation: fadeIn 0.3s; }
        .details-hero { position: relative; width: 100%; height: 50vh; overflow: hidden; background: #000; }
        #details-header-bg { position: absolute; inset: 0; background-size: cover; background-position: center 15%; animation: subtleZoom 10s infinite alternate ease-in-out; z-index: 1; }
        .details-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 15%, transparent 95%); z-index: 2; }
        .details-info { padding: 0 5% 40px; margin-top: -80px; position: relative; z-index: 5; }
        .details-info h2 { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .btn-play-main { background: white; color: black; border: none; padding: 15px 35px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; display: flex; align-items: center; gap: 10px; }

        #main-content { padding-top: 80px; }
        .category-row { position: relative; width: 100%; margin-bottom: 20px; }
        .category-title { font-size: 18px; font-weight: bold; margin: 20px 4% 10px; color: #fff; text-transform: uppercase; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; padding: 0 4% 10px; scrollbar-width: none; scroll-behavior: smooth; }
        .card { flex: 0 0 150px; width: 150px; cursor: pointer; position: relative; }
        .card img { width: 150px; height: 225px; object-fit: cover; border-radius: 4px; background: #222; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="login-screen">
    <form class="login-box" onsubmit="event.preventDefault(); checkLogin();">
        <div class="logo" style="margin-bottom:20px">SFPP ELITE</div>
        <input type="email" id="user" placeholder="E-mail" required>
        <input type="password" id="pass" placeholder="Mot de passe" required>
        <button type="submit">CONNEXION</button>
    </form>
</div>

<div id="profile-screen">
    <h1 style="font-size: 32px;">Qui regarde ?</h1>
    <div class="profile-grid" id="profile-list"></div>
    <button class="btn-manage" onclick="toggleEditMode()">GÉRER LES PROFILS</button>
</div>

<header>
    <div class="logo" id="header-logo">SFPP</div>
    <div class="nav-links">
        <button class="nav-btn active" id="btn-all" onclick="changeView('all')">Accueil</button>
        <button class="nav-btn" id="btn-movies" onclick="changeView('movies')">Films</button>
        <button class="nav-btn" id="btn-series" onclick="changeView('series')">Séries</button>
        <button class="nav-btn" onclick="location.reload()">🔄</button>
    </div>
    <div class="header-actions">
        <button class="btn-icon" onclick="openSearch()">🔍</button>
        <button class="btn-logout" onclick="switchProfile()">PROFILS</button>
    </div>
</header>

<div id="details-overlay">
    <div class="details-content">
        <button class="btn-close-details" onclick="closeDetails()">✕</button>
        <div class="details-hero"><div id="details-header-bg"></div></div>
        <div class="details-info">
            <h2 id="details-title"></h2>
            <div class="details-actions">
                <button id="details-play-btn" class="btn-play-main">▶ Lancer</button>
            </div>
            <p id="details-desc" class="synopsis"></p>
        </div>
    </div>
</div>

<section id="player-section">
    <button class="btn-close-player" onclick="closeP()">✕</button>
    <div class="video-container">
        <div id="player-blur-bg" class="vjs-blur-bg"></div>
        <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="metadata"></video>
        <div id="clappr-container"></div>
    </div>
</section>

<div id="main-content">
    <div id="categories-container"></div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDipnvk8nHn_mnj6HObA038DhS2U39kSgU",
      authDomain: "sfpp-elite.firebaseapp.com",
      databaseURL: "https://sfpp-elite-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sfpp-elite"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.checkLogin = function() {
        const email = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, email, pass).catch(() => alert("Erreur de connexion."));
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            loadPlaylist();
            initProfiles();
            if(localStorage.getItem('sfpp_profile')) selectProfile(localStorage.getItem('sfpp_profile'), "👤");
            else document.getElementById('profile-screen').style.display = 'flex';
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.selectProfile = (name) => {
        localStorage.setItem('sfpp_profile', name);
        document.getElementById('profile-screen').style.display = 'none';
        render();
    };

    window.switchProfile = () => { localStorage.removeItem('sfpp_profile'); location.reload(); };
</script>

<script>
let player, playlistData = [], currentProfile = null, clapprPlayer = null, currentView = 'all';

async function loadPlaylist() {
    const response = await fetch('films.json?v=' + Date.now());
    playlistData = await response.json();
    render();
}

function render() {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    const cats = [...new Set(playlistData.map(m => m.cat))];
    cats.forEach(c => {
        let html = `<div class="category-title">${c}</div><div class="category-row"><div class="carousel">`;
        playlistData.filter(m => m.cat === c).forEach(m => {
            html += `<div class="card" onclick="openDetails(${playlistData.indexOf(m)})"><img src="${m.img}"><div class="card-name">${m.t}</div></div>`;
        });
        html += `</div></div>`;
        cont.innerHTML += html;
    });
}

function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-desc').innerText = m.desc || "";
    document.getElementById('details-header-bg').style.backgroundImage = `url('${m.img}')`;
    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
    document.getElementById('details-overlay').style.display = 'flex';
}

// --- LA MODIFICATION QUI FONCTIONNE ---
function playMovie(idx) {
    const m = playlistData[idx];
    document.getElementById('details-overlay').style.display = 'none';
    document.getElementById('player-section').style.display = 'block';
    
    let url = "";
    try { url = atob(m.url); } catch(e) { url = m.url; }

    // Utilisation d'un proxy pour forcer le HTTP sur le HTTPS
    if (url.startsWith('http://')) {
        url = "https://corsproxy.io/?" + encodeURIComponent(url);
    }

    // On cache VideoJS et on active Clappr
    document.getElementById('main-video').style.display = 'none';
    const container = document.getElementById('clappr-container');
    container.style.display = 'block';
    
    if(clapprPlayer) clapprPlayer.destroy();
    
    clapprPlayer = new Clappr.Player({
        source: url,
        parentId: "#clappr-container",
        autoPlay: true,
        width: '100%',
        height: '100%',
        poster: m.img,
        hlsjsConfig: { 
            enableWorker: true,
            xhrSetup: function(xhr) { xhr.withCredentials = false; }
        }
    });
}

function closeP() {
    if(clapprPlayer) clapprPlayer.destroy();
    document.getElementById('player-section').style.display = 'none';
}

function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }
function initProfiles() {
    const list = document.getElementById('profile-list');
    list.innerHTML = [1,2,3,4].map(i => `<div class="profile-item" onclick="selectProfile('Profil ${i}')"><div class="profile-avatar">👤</div><div class="profile-name">Profil ${i}</div></div>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
    player = videojs('main-video', { controls: true });
});
</script>
</body>
</html>
