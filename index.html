<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - FIX FINAL</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">
    <style>
        :root { --accent: #e50914; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: Arial, sans-serif; margin: 0; padding-bottom: 50px; user-select: none; }
        [tabindex="0"]:focus { outline: 3px solid white !important; transform: scale(1.05); }
        #login-screen, #profile-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: #111; padding: 30px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #333; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 4px; }
        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.95); display: flex; align-items: center; padding: 0 15px; z-index: 2000; border-bottom: 1px solid #222; justify-content: space-between; box-sizing: border-box; }
        #main-content { padding-top: 80px; }
        .category-title { font-size: 18px; font-weight: bold; margin: 20px 4% 10px; text-transform: uppercase; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; padding: 0 4% 10px; scroll-behavior: smooth; }
        .card { flex: 0 0 150px; width: 150px; cursor: pointer; }
        .card img { width: 100%; height: 225px; object-fit: cover; border-radius: 4px; }
        .card-name { margin-top: 6px; font-size: 12px; text-align: center; color: #bbb; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        #details-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3500; display: none; overflow-y: auto; padding: 40px 5%; }
        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; }
        .btn-close-player { position: absolute; top: 20px; left: 20px; z-index: 5000; background: rgba(0,0,0,0.5); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; }
        #filemoon-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 4900; display: none; }
        #extractor-loader { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 6000; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="extractor-loader">
    <div class="spinner"></div>
    <p style="margin-top:15px">Extraction du flux MP4 fluide...</p>
</div>

<div id="login-screen">
    <form class="login-box" onsubmit="event.preventDefault(); checkLogin();">
        <h2 style="color:var(--accent)">SFPP ELITE</h2>
        <input type="email" id="user" placeholder="E-mail" required tabindex="0">
        <input type="password" id="pass" placeholder="Mot de passe" required tabindex="0">
        <button type="submit" tabindex="0">CONNEXION</button>
    </form>
</div>

<div id="profile-screen" style="display:none">
    <div class="profile-item" onclick="selectProfile()" tabindex="0" style="text-align:center; cursor:pointer">
        <div style="width:100px; height:100px; background:#333; font-size:40px; display:flex; align-items:center; justify-content:center; border-radius:4px; margin:0 auto">👤</div>
        <p>Elite</p>
    </div>
</div>

<header id="app-header" style="display:none">
    <div style="color:var(--accent); font-weight:bold;">SFPP ELITE</div>
</header>

<main id="main-content" style="display:none">
    <div id="categories-container"></div>
</main>

<div id="details-overlay">
    <h2 id="details-title"></h2>
    <button id="details-play-btn" style="background:white; color:black; padding:15px 30px; font-weight:bold; border:none; border-radius:4px;" tabindex="0">▶ LANCER LE FILM</button>
    <button onclick="document.getElementById('details-overlay').style.display='none'" style="background:#333; color:white; padding:15px; border:none; margin-left:10px" tabindex="0">RETOUR</button>
</div>

<section id="player-section">
    <button class="btn-close-player" onclick="closeP()" tabindex="0">✕</button>
    <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="auto" style="width:100%; height:100%"></video>
    <iframe id="filemoon-iframe" allowfullscreen allow="autoplay"></iframe>
</section>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
let player, playlistData = [];

function checkLogin() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('profile-screen').style.display = 'flex';
}

function selectProfile() {
    document.getElementById('profile-screen').style.display = 'none';
    document.getElementById('app-header').style.display = 'flex';
    document.getElementById('main-content').style.display = 'block';
    loadPlaylist();
}

async function loadPlaylist() {
    const response = await fetch('films.json?v=' + Date.now());
    playlistData = await response.json();
    render();
}

function render() {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    const cats = [...new Set(playlistData.map(m => m.cat.split(',')[0].trim()))];
    cats.forEach(c => {
        const items = playlistData.filter(m => m.cat.includes(c));
        let html = `<div class="category-title">${c}</div><div class="carousel">`;
        items.forEach(m => {
            html += `<div class="card" tabindex="0" onclick="openDetails(${playlistData.indexOf(m)})">
                <img src="${m.img}"><div class="card-name">${m.t}</div></div>`;
        });
        cont.innerHTML += html + `</div>`;
    });
}

function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-overlay').style.display = 'flex';
    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
}

// --- FONCTION D'EXTRACTION CORRIGÉE ---
async function playMovie(idx) {
    const m = playlistData[idx];
    let url = m.url;
    const loader = document.getElementById('extractor-loader');
    const videoJS = document.getElementById('main-video');
    const iframe = document.getElementById('filemoon-iframe');
    const pSection = document.getElementById('player-section');

    // 1. Décodage et correction de l'URL
    try { url = window.atob(url); } catch(e) {}
    
    // Si c'est juste un ID (ex: Z9dzBRyqzk1b), on recréé l'URL FileMoon
    if (!url.includes("http")) {
        url = "https://filemoon.org/e/" + url;
    }

    pSection.style.display = "block";
    document.getElementById('details-overlay').style.display = 'none';

    // 2. Extraction du lien MP4 direct pour Video.js
    if (url.includes("filemoon.org")) {
        loader.style.display = "flex";
        try {
            const proxy = "https://api.allorigins.win/raw?url=";
            const response = await fetch(proxy + encodeURIComponent(url));
            const html = await response.text();
            const regex = /file:"(https:\/\/[\w\.\/\-\?\&\%=\d\_]+?\.mp4.*?)"/;
            const match = html.match(regex);

            if (match && match[1]) {
                // SUCCÈS : On utilise le lecteur Premium avec le lien MP4 fluide
                loader.style.display = "none";
                iframe.style.display = "none";
                videoJS.style.display = "block";
                player.src({ src: match[1], type: "video/mp4" });
                player.play();
                return;
            }
        } catch (e) { console.error(e); }

        // ÉCHEC EXTRACTION : Fallback sur l'Iframe (Plan B)
        loader.style.display = "none";
        videoJS.style.display = "none";
        iframe.style.display = "block";
        iframe.src = url.replace("/d/", "/e/").replace("/en/", "/e/");
    } else {
        // LIEN NORMAL
        iframe.style.display = "none";
        videoJS.style.display = "block";
        player.src({ src: url, type: "video/mp4" });
        player.play();
    }
}

function closeP() {
    document.getElementById('filemoon-iframe').src = "";
    document.getElementById('player-section').style.display = 'none';
    if(player) player.pause();
}

document.addEventListener('DOMContentLoaded', () => { 
    player = videojs('main-video'); 
});
</script>
</body>
</html>
