<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - VERSION FINALE</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">

    <style>
        :root { --accent: #e50914; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: Arial, sans-serif; margin: 0; padding-bottom: 50px; user-select: none; overflow-x: hidden; }
        
        /* FOCUS TV */
        [tabindex="0"]:focus { outline: 3px solid white !important; transform: scale(1.05); background: rgba(255,255,255,0.1); z-index: 100; }

        #login-screen, #profile-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: #111; padding: 30px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #333; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }

        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.95); display: flex; align-items: center; padding: 0 15px; z-index: 2000; border-bottom: 1px solid #222; justify-content: space-between; box-sizing: border-box; }
        .logo { color: var(--accent); font-weight: 900; font-size: 18px; }

        #main-content { padding-top: 80px; }
        .category-title { font-size: 18px; font-weight: bold; margin: 20px 4% 10px; text-transform: uppercase; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; padding: 0 4% 10px; scrollbar-width: none; }

        .card { flex: 0 0 150px; width: 150px; cursor: pointer; position: relative; }
        .card img { width: 100%; height: 225px; object-fit: cover; border-radius: 4px; background: #222; }
        .card-name { margin-top: 6px; font-size: 12px; text-align: center; color: #bbb; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        #details-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3500; display: none; padding: 40px 5%; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-play { background: white; color: black; border: none; padding: 15px 40px; border-radius: 4px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px; }

        /* PLAYER SECTION */
        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; }
        #main-video, #filemoon-iframe { width: 100% !important; height: 100% !important; border: none; }
        .btn-close-player { position: absolute; top: 20px; left: 20px; z-index: 5000; background: rgba(0,0,0,0.5); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color:var(--accent)">SFPP ELITE</h2>
        <input type="email" id="user" placeholder="E-mail" required tabindex="0">
        <input type="password" id="pass" placeholder="Mot de passe" required tabindex="0">
        <button onclick="checkLogin()" tabindex="0">CONNEXION</button>
    </div>
</div>

<div id="profile-screen" style="display:none">
    <div onclick="selectProfile()" tabindex="0" style="cursor:pointer">
        <div style="width:100px; height:100px; background:#333; font-size:40px; display:flex; align-items:center; justify-content:center; border-radius:4px;">👤</div>
        <p style="text-align:center">Utilisateur</p>
    </div>
</div>

<header id="app-header" style="display:none">
    <div class="logo">SFPP ELITE</div>
</header>

<main id="main-content" style="display:none">
    <div id="categories-container"></div>
</main>

<div id="details-overlay">
    <h2 id="details-title" style="font-size:30px"></h2>
    <p id="details-desc" style="max-width:600px; color:#888;"></p>
    <button id="details-play-btn" class="btn-play" tabindex="0">▶ LANCER LE FILM</button>
    <button onclick="closeDetails()" style="background:none; border:1px solid #444; color:#666; margin-top:20px; padding:10px 20px; border-radius:4px; cursor:pointer;" tabindex="0">RETOUR</button>
</div>

<section id="player-section">
    <button class="btn-close-player" onclick="closeP()" tabindex="0">✕</button>
    <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="auto" style="display:none"></video>
    <iframe id="filemoon-iframe" allowfullscreen allow="autoplay" style="display:none"></iframe>
</section>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
let player, playlistData = [];

function checkLogin() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('profile-screen').style.display = 'flex';
}

function selectProfile() {
    document.getElementById('profile-screen').style.display = 'none';
    document.getElementById('app-header').style.display = 'flex';
    document.getElementById('main-content').style.display = 'block';
    loadPlaylist();
}

async function loadPlaylist() {
    const res = await fetch('films.json?v=' + Date.now());
    playlistData = await res.json();
    render();
}

function render() {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    const cats = [...new Set(playlistData.map(m => m.cat.split(',')[0].trim()))];
    cats.forEach(c => {
        const items = playlistData.filter(m => m.cat.includes(c));
        let html = `<div class="category-title">${c}</div><div class="carousel">`;
        items.forEach(m => {
            html += `<div class="card" tabindex="0" onclick="openDetails(${playlistData.indexOf(m)})">
                <img src="${m.img}"><div class="card-name">${m.t}</div></div>`;
        });
        cont.innerHTML += html + `</div>`;
    });
}

function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-desc').innerText = m.desc || "";
    document.getElementById('details-overlay').style.display = 'flex';
    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
}

function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }

function playMovie(idx) {
    const m = playlistData[idx];
    let url = m.url;
    
    // Décodage si nécessaire
    try { url = window.atob(url); } catch(e) {}

    const pSection = document.getElementById('player-section');
    const videoJS = document.getElementById('main-video');
    const iframe = document.getElementById('filemoon-iframe');

    pSection.style.display = "block";
    document.getElementById('details-overlay').style.display = 'none';

    // SI C'EST UN ID OU UN LIEN FILEMOON
    if (!url.includes("http") || url.includes("filemoon.org")) {
        // Nettoyage de l'ID si c'est une URL complète
        let fileId = url.includes("http") ? url.split('/').find(p => p.length === 12) : url;
        
        videoJS.style.display = "none";
        iframe.style.display = "block";
        // LE LIEN MAGIQUE : On force le paramètre /e/ pour ouvrir le LECTEUR et non le téléchargement
        iframe.src = "https://filemoon.org/e/" + fileId;
    } else {
        // LIEN NORMAL DIRECT
        iframe.style.display = "none";
        videoJS.style.display = "block";
        player.src({ src: url, type: "video/mp4" });
        player.play();
    }
}

function closeP() {
    const iframe = document.getElementById('filemoon-iframe');
    iframe.src = "";
    iframe.style.display = "none";
    if(player) player.pause();
    document.getElementById('player-section').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', () => { 
    player = videojs('main-video'); 
    document.addEventListener('keydown', (e) => {
        if(e.keyCode === 13 && document.activeElement) document.activeElement.click();
        if(e.keyCode === 8 || e.keyCode === 27) closeP();
    });
});
</script>
</body>
</html>
