<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - MA LISTE COMPLÈTE</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SFPP ELITE">
    <meta name="theme-color" content="#050505">

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">
    <link href="https://unpkg.com/@silvermine/videojs-chromecast@1.5.0/dist/silvermine-videojs-chromecast.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* DESIGN ÉPURÉ ET CLARTÉ DE LECTURE */
        :root { 
            --accent: #e50914; 
            --gold: #ffcc00; 
            --bg: #0b0b0b; 
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding-bottom: 50px; 
            -webkit-user-select: none; 
            user-select: none; 
            line-height: 1.5;
        }
        
        [tabindex="0"]:focus {
            outline: 3px solid var(--accent) !important;
            outline-offset: 2px;
        }

        /* LOGIN & PROFILES */
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #141414; padding: 40px; border-radius: 12px; width: 320px; text-align: center; border: 1px solid #222; }
        .login-box input { width: 100%; padding: 14px; margin: 10px 0; background: #222; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .login-box button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        
        #profile-screen { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .profile-avatar { width: 110px; height: 110px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; font-size: 45px; border: 3px solid transparent; transition: 0.2s; }
        .profile-item:hover .profile-avatar { transform: scale(1.05); border-color: white; }
        .profile-name { font-size: 16px; color: var(--text-dim); }

        /* HEADER */
        header { 
            position: fixed; top: 0; width: 100%; height: 70px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 100%); 
            display: flex; align-items: center; padding: 0 4%; z-index: 2000; 
            backdrop-filter: blur(10px); box-sizing: border-box;
        }
        .logo { color: var(--accent); font-weight: 900; font-size: 22px; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 20px; margin-left: 30px; overflow-x: auto; scrollbar-width: none; }
        .nav-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; padding: 8px 0; border-bottom: 2px solid transparent; }
        .nav-btn.active { color: white; border-bottom-color: var(--accent); }

        /* CARDS & CAROUSEL */
        .category-title { font-size: 20px; font-weight: bold; margin: 30px 4% 15px; color: #eee; letter-spacing: 0.5px; }
        .carousel { display: flex; gap: 15px; padding: 0 4% 20px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
        .card { flex: 0 0 160px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .card:hover { transform: scale(1.05); z-index: 2; }
        .card img { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card-name { margin-top: 10px; font-size: 13px; font-weight: 500; text-align: left; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* DETAILS OVERLAY - LISIBILITÉ AMÉLIORÉE */
        #details-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3500; display: none; overflow-y: auto; }
        .details-hero { height: 55vh; position: relative; }
        #details-header-bg { position: absolute; inset: 0; background-size: cover; background-position: center 20%; }
        .details-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, transparent 100%); }
        
        .details-info { padding: 0 5% 60px; margin-top: -100px; position: relative; z-index: 10; }
        .details-info h2 { font-size: 40px; margin: 0 0 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .synopsis { font-size: 17px; color: #ddd; line-height: 1.7; margin-bottom: 30px; max-width: 800px; }
        
        .btn-play-main { background: white; color: black; border: none; padding: 14px 40px; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-play-main:hover { background: #e0e0e0; transform: scale(1.05); }

        /* SERIES & EPISODES */
        .episode-item { background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 12px; transition: background 0.2s; border: 1px solid #333; }
        .episode-item:hover { background: #252525; border-color: #444; }

        /* PROGRESS BAR */
        .prog-bg { position: absolute; bottom: 35px; left: 10px; right: 10px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .prog-fill { height: 100%; background: var(--accent); border-radius: 2px; }

        @media (max-width: 768px) {
            .details-info h2 { font-size: 28px; }
            .card { flex: 0 0 130px; }
            .card img { height: 190px; }
        }
        
        /* Utility classes */
        .is-editing .edit-icon { display: block !important; }
        .nav-arrow { display: none; } /* On retire les flèches pour un design mobile-first plus propre */
        @media (min-width: 1024px) { .nav-arrow { display: flex; } }
    </style>
</head>
<body oncontextmenu="return false;"> 

<div id="login-screen">
    <form class="login-box" onsubmit="event.preventDefault(); checkLogin();">
        <div class="logo" style="margin-bottom:20px">SFPP ELITE</div>
        <input type="email" id="user" name="email" placeholder="E-mail" autocapitalize="none" autocomplete="username" required>
        <input type="password" id="pass" name="password" placeholder="Mot de passe" autocomplete="current-password" required>
        <button type="submit" tabindex="0">CONNEXION</button>
        <button type="button" style="background:none; border:none; color:#666; font-size:11px; margin-top:15px; cursor:pointer; text-decoration:underline;" onclick="requestAccess()" tabindex="0">Nouveau ? Demander un accès</button>
    </form>
</div>

<div id="profile-screen">
    <h1 style="font-size: 32px; margin-bottom: 40px;">Qui regarde ?</h1>
    <div class="profile-grid" id="profile-list" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px;"></div>
    <button class="btn-manage" id="manage-btn" onclick="toggleEditMode()" style="margin-top: 50px; background:none; border:1px solid #444; color:#888; padding:12px 25px; cursor:pointer;" tabindex="0">GÉRER LES PROFILS</button>
    <button onclick="logout()" style="margin-top: 20px; background:none; border:none; color:#444; cursor:pointer; font-size: 12px;" tabindex="0">DÉCONNEXION</button>
</div>

<header>
    <div class="logo" id="header-logo">SFPP</div>
    <div class="nav-links">
        <button class="nav-btn active" id="btn-all" onclick="changeView('all')" tabindex="0">Accueil</button>
        <button class="nav-btn" id="btn-movies" onclick="changeView('movies')" tabindex="0">Films</button>
        <button class="nav-btn" id="btn-series" onclick="changeView('series')" tabindex="0">Séries</button>
        <button class="nav-btn" id="btn-fav" onclick="changeView('fav')" tabindex="0">Ma Liste ❤️</button>
        <button class="nav-btn" onclick="location.reload()" tabindex="0">🔄</button>
    </div>
    <div style="display:flex; align-items:center; gap:15px; margin-left:auto;">
        <button style="background:none; border:none; color:white; font-size:20px; cursor:pointer;" onclick="openSearch()" tabindex="0">🔍</button>
        <button onclick="switchProfile()" style="background:#333; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:11px; cursor:pointer;" tabindex="0">PROFILS</button>
    </div>
    <div id="search-overlay" style="position:absolute; inset:0; background:#000; display:none; align-items:center; padding:0 5%;">
        <input type="text" id="searchBar" onkeyup="filter()" placeholder="Rechercher un film, une série..." style="flex:1; background:#222; border:none; color:white; padding:12px 20px; border-radius:30px; font-size:16px;">
        <button onclick="closeSearch()" style="margin-left:15px; background:none; border:none; color:white; font-size:24px;">✕</button>
    </div>
</header>

<div id="details-overlay">
    <div class="details-content">
        <button onclick="closeDetails()" style="position:fixed; top:25px; right:25px; z-index:100; background:rgba(0,0,0,0.5); border:none; color:white; width:45px; height:45px; border-radius:50%; font-size:20px; cursor:pointer;">✕</button>
        <div class="details-hero">
             <div id="details-header-bg"></div>
        </div>
        <div class="details-info">
            <h2 id="details-title"></h2>
            <div style="margin-bottom:20px; color:#aaa; font-weight:600; display:flex; gap:15px;">
                <span id="details-meta-year"></span>
                <span id="details-meta-cat"></span>
                <span id="details-stars-display" style="color:var(--gold)"></span>
            </div>
            <div style="display:flex; gap:15px; margin-bottom:40px;">
                <button id="details-play-btn" class="btn-play-main" tabindex="0">▶ Lancer</button>
                <button id="details-fav-btn" style="background:rgba(255,255,255,0.1); border:1px solid #444; color:white; padding:14px 25px; border-radius:6px; cursor:pointer;" tabindex="0">+ Ma Liste</button>
            </div>
            <p id="details-desc" class="synopsis"></p>
            
            <div class="category-title" style="margin:40px 0 15px 0">Bande-annonce</div>
            <div id="details-trailer-box" style="width:100%; max-width:800px; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;"></div>

            <div class="category-title" style="margin:40px 0 15px 0">Casting</div>
            <div id="details-meta-cast" style="display:flex; gap:20px; overflow-x:auto; padding-bottom:20px;"></div>
        </div>
    </div>
</div>

<div id="series-overlay">
    <div style="padding: 100px 5% 50px;">
        <button onclick="closeSeries()" style="background:#333; color:white; border:none; padding:12px 25px; border-radius:6px; cursor:pointer; margin-bottom:30px;">← Retour</button>
        <div id="series-detail-content"></div>
    </div>
</div>

<section id="player-section" style="display:none; position:fixed; inset:0; background:#000; z-index:5000;">
    <button onclick="closeP()" style="position:absolute; top:20px; left:20px; z-index:5100; background:rgba(0,0,0,0.5); border:none; color:white; width:45px; height:45px; border-radius:50%; cursor:pointer;">✕</button>
    <div id="player-blur-bg" style="position:absolute; inset:0; background-size:cover; filter:blur(30px) brightness(0.3);"></div>
    <div class="video-container" id="video-container" style="position:relative; width:100%; height:100%; display:flex; align-items:center;">
        <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="metadata" style="width:100%; height:100%;"></video>
        <button id="next-episode-btn" onclick="playNextEpisode()" style="position:absolute; bottom:100px; right:40px; display:none; background:var(--accent); color:white; border:2px solid white; padding:15px 30px; border-radius:8px; font-weight:bold; cursor:pointer; z-index:5200;">ÉPISODE SUIVANT ⏭️</button>
    </div>
</section>

<div id="main-content" style="padding-top: 80px;">
    <div id="expiration-banner" style="display:none; background:var(--gold); color:black; text-align:center; padding:12px; font-weight:bold; font-size:14px;"></div>
    <div id="history-sec" style="display:none">
        <div class="category-title">Reprendre avec <span id="current-user-name"></span></div>
        <div class="carousel" id="history-container"></div>
    </div>
    <div id="categories-container"></div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
