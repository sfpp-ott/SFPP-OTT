<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - MA LISTE COMPLÈTE</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SFPP ELITE">
    <meta name="theme-color" content="#050505">

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">
    <link href="https://unpkg.com/@silvermine/videojs-chromecast@1.5.0/dist/silvermine-videojs-chromecast.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { --accent: #e50914; --gold: #ffcc00; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding-bottom: 50px; -webkit-user-select: none; user-select: none; overflow-x: hidden; }
        
        /* OPTIMISATION TV : Focus ultra-visible */
        [tabindex="0"]:focus {
            outline: 4px solid white !important;
            outline-offset: 2px;
            transform: scale(1.08);
            background: rgba(255,255,255,0.15) !important;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            transition: transform 0.2s ease-in-out;
        }

        #login-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #111; padding: 30px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #333; position: relative; z-index: 10000; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-request { background: none !important; border: none; color: #666 !important; font-size: 11px; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        #profile-screen { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 80%; max-width: 400px; margin-top: 30px; }
        .profile-item { text-align: center; cursor: pointer; transition: transform 0.2s; position: relative; border-radius: 8px; padding: 10px; }
        .profile-avatar { width: 100px; height: 100px; background: #333; border-radius: 4px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid transparent; }
        .profile-name { font-size: 14px; color: #888; }
        
        .edit-icon { position: absolute; top: 35px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); border-radius: 50%; padding: 5px; display: none; font-size: 20px; }
        .is-editing .edit-icon { display: block; }
        .btn-manage { margin-top: 40px; background: none; border: 1px solid #444; color: #888; padding: 10px 20px; cursor: pointer; font-size: 14px; letter-spacing: 1px; }

        header { 
            position: fixed; top: 0; width: 100%; height: 70px; 
            background: rgba(0,0,0,0.95); display: flex; align-items: center; 
            padding: 0 25px; z-index: 2000; border-bottom: 1px solid #222; 
            justify-content: space-between; box-sizing: border-box; gap: 10px;
        }
        .logo { color: var(--accent); font-weight: 900; font-size: 22px; flex-shrink: 0; }
        
        .nav-links { 
            display: flex; gap: 15px; flex: 1; overflow-x: auto; 
            white-space: nowrap; align-items: center; scrollbar-width: none;
            -webkit-overflow-scrolling: touch; justify-content: flex-start;
        }
        .nav-links::-webkit-scrollbar { display: none; }
        
        .nav-btn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 15px; font-weight: 500; padding: 10px 15px; transition: color 0.3s; flex-shrink: 0; border-radius: 4px; }
        .nav-btn.active { color: white; font-weight: bold; border-bottom: 3px solid var(--accent); }

        #search-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 70px;
            background: #000; display: none; align-items: center; padding: 0 15px;
            box-sizing: border-box; z-index: 2001;
        }
        #searchBar { flex: 1; background: #222; border: 1px solid #444; color: white; padding: 12px 20px; border-radius: 20px; outline: none; font-size: 16px; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        .btn-icon { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px; }
        .btn-logout { background: #333; color: white; border: 1px solid #444; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; flex-shrink: 0; }

        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; overflow: hidden; }
        .video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        
        .vjs-blur-bg {
            position: absolute; inset: 0; z-index: 0;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3); transform: scale(1.1); 
        }
        
        .video-js { z-index: 1 !important; width: 100% !important; height: 100% !important; }
        .video-js video { object-fit: contain !important; }

        #next-episode-btn {
            position: absolute; bottom: 85px; right: 25px; z-index: 99999 !important;
            background: #e50914; color: white; border: 2px solid #fff; padding: 15px 25px;
            border-radius: 8px; font-weight: bold; font-size: 15px; display: none; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9); animation: fadeIn 0.5s;
        }

        .btn-close-player {
            position: absolute; top: 20px; left: 20px; z-index: 5000;
            background: rgba(0,0,0,0.5); border: none; color: white;
            width: 50px; height: 50px; border-radius: 50%; font-size: 25px; cursor: pointer;
        }

        #expiration-banner { display: none; background: #ffcc00; color: #000; text-align: center; padding: 12px; font-size: 14px; font-weight: bold; position: relative; z-index: 1500; }
        
        #details-overlay {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 3500; display: none; flex-direction: column; overflow-y: auto;
        }
        .details-content { position: relative; width: 100%; display: block; animation: fadeIn 0.3s; }
        
        @keyframes subtleZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .details-hero { 
            position: relative; width: 100%; height: 55vh; 
            overflow: hidden; background: #000;
        }

        @media (orientation: landscape) or (min-width: 1024px) {
            .details-hero { height: 50vh; }
            .details-info { margin-top: -160px !important; }
            .details-info h2 { font-size: 48px; }
            .details-info .synopsis { max-width: 70%; font-size: 18px; }
            .trailer-box { max-width: 700px; }
        }

        #details-header-bg {
            position: absolute; inset: 0;
            background-size: cover; 
            background-position: center 15%; 
            animation: subtleZoom 10s infinite alternate ease-in-out;
            z-index: 1;
        }

        .details-hero::after { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to top, var(--bg) 15%, transparent 95%); 
            z-index: 2;
        }

        .details-info { padding: 0 5% 60px; margin-top: -80px; position: relative; z-index: 5; }
        .details-info h2 { font-size: 36px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .details-info .meta { color: #888; font-size: 16px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; }
        .details-info .synopsis { color: #ddd; line-height: 1.6; font-size: 17px; max-width: 850px; margin-bottom: 30px; }
        
        .details-actions { display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        
        .btn-play-main { 
            background: white; color: black; border: none; padding: 18px 45px; 
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 18px; 
            display: flex; align-items: center; gap: 10px;
        }

        .btn-fav-details {
            background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 18px 30px; 
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 18px;
        }

        .btn-report-hs {
            background: #222; color: #bbb; border: 1px solid #444; padding: 18px 25px;
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px;
        }

        .section-label { font-weight: bold; color: white; margin: 40px 0 20px; font-size: 20px; border-left: 5px solid var(--accent); padding-left: 15px; }
        .trailer-box { width: 100%; max-width: 850px; aspect-ratio: 16/9; background: #000; border-radius: 8px; margin-bottom: 30px; overflow: hidden; border: 1px solid #333; }
        
        .cast-row { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; }
        .actor-item { flex: 0 0 100px; text-align: center; cursor: pointer; transition: transform 0.2s; padding: 5px; border-radius: 8px; }
        .actor-item img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #333; }
        .actor-name { font-size: 12px; color: #aaa; margin-top: 10px; line-height: 1.2; }

        .btn-close-details { 
            position: absolute; top: 25px; right: 25px; 
            background: rgba(0,0,0,0.6); border: none; color: white; 
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer; z-index: 100; font-size: 22px;
        }

        #main-content { padding-top: 90px; }
        
        .category-row { position: relative; width: 100%; margin-bottom: 30px; }
        .category-title { font-size: 20px; font-weight: bold; margin: 25px 4% 15px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        
        .carousel { display: flex; overflow-x: auto; gap: 15px; padding: 0 4% 15px; scrollbar-width: none; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        
        .nav-arrow { position: absolute; top: 0; bottom: 30px; width: 60px; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 10; cursor: pointer; color: white; font-size: 35px; opacity: 0; transition: opacity 0.3s; }
        .category-row:hover .nav-arrow { opacity: 1; }
        .arrow-left { left: 0; }
        .arrow-right { right: 0; }

        .card { flex: 0 0 160px; width: 160px; cursor: pointer; position: relative; display: flex; flex-direction: column; border-radius: 6px; overflow: hidden; }
        .card img { width: 160px !important; height: 240px !important; object-fit: cover !important; border-radius: 6px; background: #222; display: block; }
        
        .card.landscape { flex: 0 0 210px; width: 210px; }
        .card.landscape img { width: 210px !important; height: 125px !important; object-fit: contain !important; background: #111; border: 1px solid #333; }

        .card-name { margin-top: 10px; font-size: 13px; text-align: center; color: #ccc; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; width: 100%; padding: 0 5px; }

        .prog-bg { position: absolute; bottom: 30px; left: 0; width: 100%; height: 5px; background: rgba(255,255,255,0.2); overflow: hidden; }
        .prog-fill { height: 100%; background: var(--accent); transition: width 0.3s; }

        .btn-fav-card {
            position: absolute; top: 12px; right: 12px; z-index: 10;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; backdrop-filter: blur(5px);
        }

        .card-rating {
            position: absolute; bottom: 42px; left: 10px; z-index: 10;
            background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 4px;
            font-size: 11px; color: var(--gold); font-weight: bold; pointer-events: none;
        }

        /* --- STYLES EPG REELS --- */
        .epg-info { font-size: 11px; color: #e50914; margin-top: 6px; text-align: center; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; width: 100%; }
        .epg-time { font-size: 10px; color: #888; text-align: center; display: block; }

        #series-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: none; overflow-y: auto; padding: 90px 5% 50px; }
        
        /* Ajustements pour mobile */
        @media (max-width: 768px) {
            header { height: 60px; padding: 0 15px; }
            .card { flex: 0 0 135px; width: 135px; }
            .card img { width: 135px !important; height: 200px !important; }
            .card.landscape { flex: 0 0 150px; width: 150px; }
            .card.landscape img { width: 150px !important; height: 90px !important; }
            .nav-btn { font-size: 13px; padding: 8px 10px; }
            .details-info h2 { font-size: 28px; }
            [tabindex="0"]:focus { transform: scale(1.02); }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="login-screen">
    <form class="login-box" onsubmit="event.preventDefault(); checkLogin();">
        <div class="logo" style="margin-bottom:20px">SFPP ELITE</div>
        <input type="email" id="user" name="email" placeholder="E-mail" autocapitalize="none" autocomplete="username" required tabindex="0">

    <h1 style="font-size: 32px;">Qui regarde ?</h1>

        <div class="details-hero">
             <div id="details-header-bg"></div>

        <div class="details-info">
            <h2 id="details-title">Titre du film</h2>
            <div class="meta">
                <span id="details-meta-year">2024</span>
                <span id="details-meta-num" style="color:#bbb; font-size:11px; font-weight:bold; display:none; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;"></span>

<section id="player-section">
    <button class="btn-close-player" onclick="closeP()" tabindex="0">✕</button>

        <div id="player-blur-bg" class="vjs-blur-bg"></div>

<div id="main-content">
    <div id="expiration-banner"></div>
    <div id="history-sec" style="display:none">
        <div class="category-title">Reprendre avec <span id="current-user-name"></span></div>
        <div class="category-row">
            <div class="nav-arrow arrow-left" onclick="scrollSide(this, -300)">‹</div>
            <div class="carousel" id="history-container"></div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<script src="https://unpkg.com/@silvermine/videojs-chromecast@1.5.0/dist/silvermine-videojs-chromecast.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDipnvk8nHn_mnj6HObA038DhS2U39kSgU",
      authDomain: "sfpp-elite.firebaseapp.com",
      databaseURL: "https://sfpp-elite-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sfpp-elite"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let deviceId = localStorage.getItem('sfpp_device_id') || Math.random().toString(36).substring(7);
    localStorage.setItem('sfpp_device_id', deviceId);

    const savedEmail = localStorage.getItem('sfpp_last_email');
    if(savedEmail) document.getElementById('user').value = savedEmail;

    async function verifyExpiration(user) {
        if (!user) return false;
        const snapshot = await get(ref(db, 'users_data/' + user.uid + '/expire'));
        const expireValue = snapshot.val();
        if (!expireValue) return false;
        
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const todayStr = `${y}-${m}-${d}`;
        
        if (todayStr >= expireValue) {
            alert("Accès expiré le " + expireValue);
            await signOut(auth);
            const mail = localStorage.getItem('sfpp_last_email');
            localStorage.clear();
            localStorage.setItem('sfpp_last_email', mail);
            localStorage.setItem('sfpp_device_id', deviceId);
            location.reload();
            return true;
        }
        return false;
    }

    window.startSessionSync = function(uid) {
        onValue(ref(db, 'sessions/' + uid), (snapshot) => {
            const session = snapshot.val();
            if (session && session.deviceId !== deviceId) {
                alert("⚠️ Ce compte est utilisé sur un autre appareil.");
                localStorage.removeItem('sfpp_profile'); 
                signOut(auth).then(() => location.reload());
            }
        });
    };

    window.checkLogin = function() {
        const email = document.getElementById('user').value.trim();
        const pass = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, email, pass).then(async (u) => {
            localStorage.setItem('sfpp_last_email', email);
            const exp = await verifyExpiration(u.user);
            if (!exp) { 
                set(ref(db, 'sessions/' + u.user.uid), { deviceId: deviceId, lastLogin: Date.now() }); 
            }
        }).catch(() => alert("Identifiants incorrects."));
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            if (await verifyExpiration(user)) return;
            window.startSessionSync(user.uid);
            document.getElementById('login-screen').style.display = 'none';
            fetchEPG(); 
            loadPlaylist();
            initProfiles();
            
            const snap = await get(ref(db, 'users_data/' + user.uid + '/expire'));
            const expireValue = snap.val();
            if(expireValue) {
                const today = new Date();
                const expireDate = new Date(expireValue);
                const diffDays = Math.ceil((expireDate - today) / (1000 * 60 * 60 * 24));
                const banner = document.getElementById('expiration-banner');
                if(diffDays > 0 && diffDays <= 5) {
                    banner.style.display = 'block';
                    banner.innerHTML = `⚠️ Fin d'accès dans ${diffDays} jour(s).`;
                } else banner.style.display = 'none';
            }
            
            const saved = localStorage.getItem('sfpp_profile');
            if(saved) selectProfile(saved, localStorage.getItem('sfpp_profile_icon'));
            else document.getElementById('profile-screen').style.display = 'flex';
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.selectProfile = async function(name, icon) {
        currentProfile = name;
        localStorage.setItem('sfpp_profile', name);
        localStorage.setItem('sfpp_profile_icon', icon);
        document.getElementById('profile-screen').style.display = 'none';
        document.getElementById('current-user-name').innerText = name;
        const user = auth.currentUser;
        if(user) {
            const snap = await get(ref(db, 'users_data/' + user.uid + '/expire'));
            document.getElementById('header-logo').innerHTML = `SFPP | ${icon} <span style="font-size:10px; color:#666;">(${snap.val()})</span>`;
        }
        render();
        pushInitialState();
    };

    window.logout = function() { 
        const mail = localStorage.getItem('sfpp_last_email');
        signOut(auth).then(() => { 
            localStorage.clear(); 
            localStorage.setItem('sfpp_last_email', mail);
            localStorage.setItem('sfpp_device_id', deviceId);
            location.reload(); 
        }); 
    };

    window.reportFilm = (title, lineInfo) => {
        if(confirm(`Voulez-vous vraiment signaler "${title}" comme hors service ?`)) {
            const reportRef = ref(db, 'signalements');
            const newReportRef = push(reportRef);
            set(newReportRef, {
                film: title,
                num: lineInfo || "Inconnu",
                date: new Date().toLocaleString(),
                signaleur: localStorage.getItem('sfpp_profile') || "Anonyme"
            }).then(() => alert("⚠️ Film signalé ! Merci.")).catch(() => alert("Erreur d'envoi."));
        }
    };

    function pushInitialState() {
        if (window.history.state?.overlay !== 'home') {
            window.history.pushState({ overlay: 'home' }, "");
        }
    }
</script>

<script>
// --- NAVIGATION OPTIMISÉE POUR TÉLÉCOMMANDE (D-PAD) ---
document.addEventListener('keydown', function(e) {
    const focusableElements = 'button, [tabindex="0"], input, .card, .nav-btn, .actor-item, .episode-item';
    const elements = Array.from(document.querySelectorAll(focusableElements)).filter(el => el.offsetParent !== null);
    const currentIndex = elements.indexOf(document.activeElement);

    // Gestion de la touche "Retour" (Back) des Android Box
    if (e.key === 'Backspace' || e.key === 'Escape' || e.keyCode === 461 || e.keyCode === 10009) {
        if (document.getElementById('player-section').style.display === 'block') {
            closeP();
            e.preventDefault();
        } else if (document.getElementById('details-overlay').style.display === 'flex') {
            closeDetails();
            e.preventDefault();
        } else if (document.getElementById('series-overlay').style.display === 'block') {
            closeSeries();
            e.preventDefault();
        }
        return;
    }

    // Navigation de base au clavier/D-pad
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        // Le navigateur gère le focus séquentiel de base, 
        // mais on peut forcer le scroll des carrousels au focus ici si besoin.
    }
});

// Empêcher l'inspection (F12)
document.onkeydown = function(e) {
    if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
        return false;
    }
};

let player, playlistData = [], currentProfile = null, isEditMode = false, currentView = 'all', currentPlayingTitle = "", exitConfirmed = false;
let isAdminMode = false, epgData = {}, hls; 

async function fetchEPG() {
    try {
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://iptv-org.github.io/epg/guides/fr/telerama.fr.json'));
        const data = await response.json();
        if (data.channels) {
            data.channels.forEach(ch => { epgData[ch.name.toUpperCase()] = ch.programs || []; });
            render(); 
        }
    } catch (e) { console.log("Erreur EPG:", e); }
}

window.addEventListener('popstate', function (event) {
    const detailsOverlay = document.getElementById('details-overlay');
    const seriesOverlay = document.getElementById('series-overlay');
    const playerSection = document.getElementById('player-section');

    if (detailsOverlay.style.display === 'flex') {
        detailsOverlay.style.display = 'none';
        document.getElementById('details-trailer-box').innerHTML = "";
        return;
    }
    if (seriesOverlay.style.display === 'block') {
        seriesOverlay.style.display = 'none';
        return;
    }
    if (playerSection.style.display === 'block') {
        saveP();
        if(hls) { hls.destroy(); hls = null; }
        player.pause(); 
        player.src("");
        playerSection.style.display = 'none';
        render();
        return;
    }

    if (!exitConfirmed) {
        history.pushState({ overlay: 'home' }, "");
        const quitter = confirm("Souhaitez-vous vraiment quitter l'application ?");
        if (quitter) {
            exitConfirmed = true;
            history.back();
        }
    }
});

async function loadPlaylist() { 
    try { 
        const response = await fetch('films.json?v=' + Date.now()); 
        playlistData = await response.json(); 
        
        const apiKey = "ec1c8fecd38d1cc5a27f15766f0848d5";
        const promises = playlistData.map(async (m, index) => {
            m.original_index = index;
            if (m.id_tmdb && (!m.img || !m.desc || !m.trailer)) {
                try {
                    const url = `https://api.themoviedb.org/3/movie/${m.id_tmdb}?api_key=${apiKey}&language=fr-FR&append_to_response=videos,credits`;
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    m.img = m.img || `https://image.tmdb.org/t/p/w500${data.poster_path}`;
                    m.bg = m.bg || `https://image.tmdb.org/t/p/original${data.backdrop_path}`;
                    m.desc = m.desc || data.overview;
                    m.year = m.year || (data.release_date ? data.release_date.split('-')[0] : "2025");
                    m.note = m.note || Math.round(data.vote_average / 2);

                    if (data.genres) m.cat = data.genres.map(g => g.name.toUpperCase()).join(', ');

                    if (!m.trailer && data.videos && data.videos.results.length > 0) {
                        const video = data.videos.results.find(v => (v.type === "Trailer") && v.site === "YouTube") || data.videos.results[0];
                        if (video) m.trailer = video.key;
                    }

                    if (!m.actors_pics && data.credits) {
                        m.actors_pics = data.credits.cast.slice(0, 10).map(a => ({ name: a.name, img: `https://image.tmdb.org/t/p/w185${a.profile_path}` }));
                    }
                } catch (e) { console.log("Erreur TMDB ID: " + m.id_tmdb); }
            }
        });
        await Promise.all(promises);
        render(); 
    } catch (e) {} 
}

function openDetails(idx) {
    if (window.history.state?.overlay !== 'details') history.pushState({ overlay: 'details' }, "");
    const m = playlistData[idx];
    const backdrop = m.bg || m.img;
    document.getElementById('details-header-bg').style.backgroundImage = `url('${backdrop}')`;
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-desc').innerText = m.desc || "Aucun résumé disponible.";
    document.getElementById('details-meta-year').innerText = m.year || "2024";
    document.getElementById('details-meta-cat').innerText = m.cat;

    const lineInfo = m.num ? m.num : (m.original_index * 7) + 2;
    const numTag = document.getElementById('details-meta-num');
    numTag.innerText = `[L${lineInfo}]`;
    numTag.style.display = isAdminMode ? "inline" : "none";

    const note = m.note || 5; 
    let stars = ""; for (let i = 0; i < 5; i++) { stars += (i < note) ? "★" : "☆"; }
    document.getElementById('details-stars-display').innerText = stars;

    let castHtml = "";
    if (m.actors_pics) {
        castHtml = m.actors_pics.map(a => `
                <div class="actor-item" tabindex="0" onclick="searchByActor('${a.name}')">
                    <img src="${a.img}" onerror="this.src='https://via.placeholder.com/80x80?text=?'">
                    <div class="actor-name">${a.name}</div>
                </div>`).join('');
    }
    document.getElementById('details-meta-cast').innerHTML = castHtml;
    document.getElementById('details-trailer-box').innerHTML = m.trailer ? `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${m.trailer}?rel=0" frameborder="0" allowfullscreen></iframe>` : "";
    
    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
    document.getElementById('details-fav-btn').onclick = () => toggleFav(m.t);
    document.getElementById('details-report-btn').onclick = () => window.reportFilm(m.t, lineInfo);
    
    updateFavBtnUI(m.t);
    renderSuggestions(m);

    document.getElementById('details-overlay').style.display = 'flex';
    document.getElementById('details-play-btn').focus();
}

function renderSuggestions(m) {
    const primaryCat = m.cat ? m.cat.split(',')[0].trim() : "ACTION";
    const suggs = playlistData.filter(item => item.cat && item.cat.includes(primaryCat) && item.t !== m.t).sort(() => 0.5 - Math.random()).slice(0, 6);
    
    document.getElementById('details-suggestions').innerHTML = suggs.map(s => {
        const is_s_fav = JSON.parse(localStorage.getItem('sfpp_fav_' + currentProfile) || "[]").includes(s.t);
        const heartIcon = is_s_fav ? '❤️' : '♡';
        let s_stars = ""; for (let i = 0; i < 5; i++) { s_stars += (i < (s.note || 5)) ? "★" : "☆"; }
        
        return `<div class="actor-item" tabindex="0" style="flex:0 0 120px; position:relative;">
            <div class="btn-fav-card ${is_s_fav ? 'is-fav' : ''}" onclick="event.stopPropagation(); toggleFav('${s.t.replace(/'/g, "\\'")}');">${heartIcon}</div>
            <div class="card-rating">${s_stars}</div>
            <div onclick="openDetails(${playlistData.indexOf(s)})">
                <img src="${s.img}" style="border-radius:4px; height:160px; width:110px; object-fit:cover;" loading="lazy">
                <div class="actor-name">${s.t}</div>
            </div>
        </div>`}).join('');
}

window.searchByActor = function(actorName) {
    closeDetails(); 
    openSearch(); 
    document.getElementById('searchBar').value = actorName;
    filter(); 
};

function toggleFav(title) {
    let key = 'sfpp_fav_' + currentProfile;
    let favs = JSON.parse(localStorage.getItem(key) || "[]");
    if(favs.includes(title)) favs = favs.filter(t => t !== title);
    else favs.push(title);
    localStorage.setItem(key, JSON.stringify(favs));
    updateFavBtnUI(title);
    render(document.getElementById('searchBar').value);
}

function updateFavBtnUI(title) {
    let favs = JSON.parse(localStorage.getItem('sfpp_fav_' + currentProfile) || "[]");
    const btn = document.getElementById('details-fav-btn');
    if(btn) btn.innerText = favs.includes(title) ? "❤️ Dans Ma Liste" : "+ Ma Liste";
}

function closeDetails() { if (document.getElementById('details-overlay').style.display === 'flex') history.back(); }

function initProfiles() {
    let profiles = JSON.parse(localStorage.getItem('sfpp_profiles_data')) || [
        { id: 1, name: "Profil 1", icon: "🟦", color: "#1e90ff" },
        { id: 2, name: "Profil 2", icon: "🟩", color: "#2ecc71" },
        { id: 3, name: "Profil 3", icon: "🟧", color: "#e67e22" },
        { id: 4, name: "Profil 4", icon: "🟪", color: "#9b59b6" }
    ];
    document.getElementById('profile-list').innerHTML = profiles.map(p => `
        <div class="profile-item" onclick="handleProfileClick(${p.id}, '${p.name.replace(/'/g, "\\'")}', '${p.icon}')" tabindex="0">
            <div class="profile-avatar" style="background:${p.color}">${p.icon}</div>
            <div class="edit-icon">✏️</div>
            <div class="profile-name">${p.name}</div>
        </div>`).join('');
}

function handleProfileClick(id, name, icon) {
    if(isEditMode) {
        let n = prompt("Nouveau nom :", name);
        if(n && n.trim() !== "") {
            let profiles = JSON.parse(localStorage.getItem('sfpp_profiles_data')) || [];
            const idx = profiles.findIndex(p => p.id === id);
            if(idx !== -1) { profiles[idx].name = n; localStorage.setItem('sfpp_profiles_data', JSON.stringify(profiles)); initProfiles(); }
        }
    } else selectProfile(name, icon);
}

function saveP() {
    if(!currentPlayingTitle || !currentProfile) return;
    const cur = player.currentTime(); const dur = player.duration();
    if(dur > 0 && cur > 0) {
        let prog = JSON.parse(localStorage.getItem('sfpp_p_'+currentProfile) || "{}");
        prog[currentPlayingTitle] = { t: cur, p: (cur/dur)*100 };
        localStorage.setItem('sfpp_p_'+currentProfile, JSON.stringify(prog));
    }
}

function scrollSide(btn, amt) { btn.parentElement.querySelector('.carousel').scrollBy({ left: amt, behavior: 'smooth' }); }

function render(search = "") {
    const cont = document.getElementById('categories-container');
    const histSec = document.getElementById('history-sec');
    const histCont = document.getElementById('history-container');
    cont.innerHTML = ""; histCont.innerHTML = "";
    const s = search.toLowerCase();

    if(s === "admin") { isAdminMode = true; document.getElementById('searchBar').value = ""; alert("Mode maintenance activé."); return render(""); }

    const favs = JSON.parse(localStorage.getItem('sfpp_fav_' + currentProfile) || "[]");
    const prog = JSON.parse(localStorage.getItem('sfpp_p_' + currentProfile) || "{}");
    
    let data = playlistData;
    if(currentView === 'movies') data = playlistData.filter(m => m.cat && !m.cat.includes("SÉRIES"));
    else if(currentView === 'series') data = playlistData.filter(m => m.cat && m.cat.includes("SÉRIES"));
    else if(currentView === 'fav') data = playlistData.filter(m => favs.includes(m.t));

    // Historique
    if(currentProfile && s === "" && currentView === 'all') {
        let history = JSON.parse(localStorage.getItem('sfpp_hist_' + currentProfile) || "[]");
        if(history.length > 0) {
            histSec.style.display = "block";
            history.slice().reverse().forEach(title => {
                const m = playlistData.find(item => item.t === title);
                if(m) histCont.innerHTML += generateCardHTML(m, favs, prog);
            });
        } else histSec.style.display = "none";
    } else histSec.style.display = "none";

    // "Tous les films" pour accueil
    if (s === "" && (currentView === 'all' || currentView === 'movies')) {
        const allMovies = playlistData.filter(m => m.cat && !m.cat.includes("SÉRIES") && !m.cat.toUpperCase().includes("DIRECT") && !m.cat.toUpperCase().includes("TV"));
        if (allMovies.length > 0) {
            let html = `<div class="category-title">TOUS LES FILMS</div><div class="category-row"><div class="nav-arrow arrow-left" onclick="scrollSide(this, -400)">‹</div><div class="carousel">`;
            allMovies.forEach(m => { html += generateCardHTML(m, favs, prog); });
            cont.innerHTML += html + `</div><div class="nav-arrow arrow-right" onclick="scrollSide(this, 400)">›</div></div>`;
        }
    }

    // Catégories dynamiques
    const allGenres = [];
    data.forEach(m => { if(m.cat) { m.cat.split(',').forEach(g => { const genre = g.trim().toUpperCase(); if(!allGenres.includes(genre)) allGenres.push(genre); }); } });
    
    allGenres.sort().forEach(c => {
        const filtered = data.filter(m => {
            const matchGenre = m.cat && m.cat.toUpperCase().includes(c);
            const matchSearch = (s === "") || m.t.toLowerCase().includes(s) || (m.actors_pics && m.actors_pics.some(a => a.name.toLowerCase().includes(s)));
            return matchGenre && matchSearch;
        });

        if (filtered.length > 0) {
            const isTVCat = c.includes("DIRECT") || c.includes("TV");
            let html = `<div class="category-title">${c}</div><div class="category-row"><div class="nav-arrow arrow-left" onclick="scrollSide(this, -400)">‹</div><div class="carousel">`;
            filtered.forEach(m => { html += generateCardHTML(m, favs, prog, isTVCat); });
            cont.innerHTML += html + `</div><div class="nav-arrow arrow-right" onclick="scrollSide(this, 400)">›</div></div>`;
        }
    });
}

function generateCardHTML(m, favs, prog, isTV = false) {
    const is_fav = favs.includes(m.t);
    const pct = (prog[m.t] && prog[m.t].p > 1) ? `<div class="prog-bg"><div class="prog-fill" style="width:${prog[m.t].p}%"></div></div>` : "";
    let stars = ""; for (let i = 0; i < 5; i++) { stars += (i < (m.note || 5)) ? "★" : "☆"; }
    const clickAction = (isTV || (m.cat && (m.cat.includes("DIRECT") || m.cat.includes("TV")))) ? `playMovie(${playlistData.indexOf(m)})` : `openDetails(${playlistData.indexOf(m)})`;
    
    return `<div class="card ${isTV ? 'landscape' : ''}" tabindex="0">
        <div class="btn-fav-card ${is_fav ? 'is-fav' : ''}" onclick="event.stopPropagation(); toggleFav('${m.t.replace(/'/g, "\\'")}');">${is_fav ? '❤️' : '♡'}</div>
        ${!isTV ? `<div class="card-rating">${stars}</div>` : ''}
        <div onclick="${clickAction}">
            <img src="${m.img}" loading="lazy">${pct}
            <div class="card-name">${m.t}</div>
        </div>
    </div>`;
}

function playMovie(idx) {
    history.replaceState({ overlay: 'player' }, "");
    const m = playlistData[idx];
    currentPlayingTitle = m.t;
    document.getElementById('next-episode-btn').style.display = 'none';
    if (hls) { hls.destroy(); hls = null; }
    player.pause(); player.src(""); player.load();

    if(currentProfile) {
        let key = 'sfpp_hist_' + currentProfile;
        let hist = JSON.parse(localStorage.getItem(key) || "[]").filter(t => t !== m.t);
        hist.push(m.t); if(hist.length > 15) hist.shift();
        localStorage.setItem(key, JSON.stringify(hist));
    }
    
    document.getElementById('details-overlay').style.display = 'none';
    document.getElementById('series-overlay').style.display = 'none';
    document.getElementById('player-section').style.display = 'block';
    
    const backdrop = m.bg || m.img;
    document.getElementById('player-blur-bg').style.backgroundImage = `url('${backdrop}')`;
    player.poster(backdrop); 

    let decodedUrl = ""; try { decodedUrl = window.atob(m.url); } catch(e) { decodedUrl = m.url; }
    const prog = JSON.parse(localStorage.getItem('sfpp_p_' + currentProfile) || "{}");
    let type = decodedUrl.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';

    if (type === 'application/x-mpegURL' && Hls.isSupported()) {
        hls = new Hls(); hls.loadSource(decodedUrl);
        hls.attachMedia(document.querySelector('#main-video_html5_api'));
        hls.on(Hls.Events.MANIFEST_PARSED, function() { if(prog[m.t]) player.currentTime(prog[m.t].t); player.play(); });
        hls.on(Hls.Events.LEVEL_LOADED, function() { player.on('timeupdate', saveP); });
    } else {
        player.src({ src: decodedUrl, type: type });
        if(prog[m.t]) player.currentTime(prog[m.t].t);
        player.play();
    }
}

function playNextEpisode() {
    const parts = currentPlayingTitle.match(/(.*[SE])(\d+)(.*)/i);
    if (parts) {
        const nextTitleSearch = (parts[1] + (parseInt(parts[2]) + 1).toString().padStart(2, '0')).toUpperCase();
        const nextIdx = playlistData.findIndex(m => m.t.toUpperCase().includes(nextTitleSearch));
        if (nextIdx !== -1) playMovie(nextIdx);
    }
}

function closeP() { if (document.getElementById('player-section').style.display === 'block') history.back(); }
function closeSeries() { if (document.getElementById('series-overlay').style.display === 'block') history.back(); }
function changeView(v) { currentView = v; document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+v).classList.add('active'); render(); }
function filter() { render(document.getElementById('searchBar').value); }
function toggleEditMode() { isEditMode = !isEditMode; document.getElementById('profile-screen').classList.toggle('is-editing'); }
function switchProfile() { localStorage.removeItem('sfpp_profile'); location.reload(); }
function requestAccess() { window.location.href = "mailto:sfpp.ott@gmail.com"; }
function openSearch() { document.getElementById('search-overlay').style.display = 'flex'; document.getElementById('searchBar').focus(); }
function closeSearch() { document.getElementById('search-overlay').style.display = 'none'; document.getElementById('searchBar').value = ''; filter(); }

document.addEventListener('DOMContentLoaded', () => {
    player = videojs('main-video', { 
        controls: true, fluid: false,
        techOrder: ['chromecast', 'html5'], 
        plugins: { chromecast: { addButtonToControlBar: true, addDisplayOnControlBar: true } }
    });

    const Button = videojs.getComponent('Button');
    class Back extends Button { buildCSSClass() { return 'vjs-skip-button vjs-icon-replay-10'; } handleClick() { player.currentTime(player.currentTime()-10); } }
    class Forward extends Button { buildCSSClass() { return 'vjs-skip-button vjs-icon-forward-10'; } handleClick() { player.currentTime(player.currentTime()+10); } }
    videojs.registerComponent('Back', Back); videojs.registerComponent('Forward', Forward);
    player.ready(() => { player.getChild('controlBar').addChild('Back', {}, 1); player.getChild('controlBar').addChild('Forward', {}, 2); });

    player.on('timeupdate', function() {
        const dur = player.duration(), cur = player.currentTime();
        document.getElementById('next-episode-btn').style.display = (/S\d{2}E\d{2}/i.test(currentPlayingTitle) && dur > 0 && (dur - cur) < 80) ? 'block' : 'none';
        if(Math.floor(cur) % 5 === 0) saveP();
    });
});
</script>
