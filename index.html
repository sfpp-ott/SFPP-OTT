<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFPP ELITE TV - PREMIUM</title>
    
    <!-- Video.js et Themes -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">

    <style>
        :root { 
            --accent: #e50914; 
            --gold: #ffcc00; 
            --bg: #050505; 
            --card-w: 200px;
            --card-h: 300px;
            --tv-padding: 50px;
        }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            overflow: hidden; 
            user-select: none;
        }

        /* --- NAVIGATION AU FOCUS (TV) --- */
        [tabindex="0"] { outline: none; transition: all 0.25s ease; }
        [tabindex="0"]:focus {
            outline: 4px solid white !important;
            outline-offset: 4px;
            transform: scale(1.1) !important;
            background: rgba(255,255,255,0.15);
            z-index: 100;
        }

        /* --- LOGIN & PROFILES --- */
        #login-screen, #profile-screen { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .login-box { width: 500px; text-align: center; }
        .login-box input { 
            width: 100%; padding: 20px; margin: 15px 0; background: #222; 
            border: 2px solid #444; color: white; border-radius: 10px; font-size: 24px; 
        }
        .login-box button { 
            width: 100%; padding: 20px; background: var(--accent); color: white; 
            border: none; font-weight: bold; border-radius: 10px; font-size: 24px; cursor: pointer; 
        }

        .profile-grid { display: flex; gap: 40px; margin-top: 50px; }
        .profile-item { text-align: center; width: 220px; cursor: pointer; }
        .profile-avatar { 
            width: 200px; height: 200px; border-radius: 10px; background: #333;
            display: flex; align-items: center; justify-content: center; font-size: 90px;
            margin-bottom: 20px;
        }
        .profile-name { font-size: 24px; color: #888; }

        /* --- HEADER --- */
        header { 
            position: fixed; top: 0; width: 100%; height: 100px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); 
            display: flex; align-items: center; padding: 0 var(--tv-padding); z-index: 2000; 
            box-sizing: border-box; justify-content: space-between;
        }
        .logo { color: var(--accent); font-weight: 900; font-size: 35px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-btn { 
            background: none; border: none; color: #bbb; cursor: pointer; 
            font-size: 22px; font-weight: bold; padding: 10px 20px; border-radius: 8px;
        }
        .nav-btn.active { color: white; border-bottom: 5px solid var(--accent); }

        /* --- CONTENT CAROUSELS --- */
        #main-content { padding-top: 120px; height: 100vh; overflow-y: auto; scroll-behavior: smooth; }
        .category-row { margin-bottom: 50px; padding: 0 var(--tv-padding); }
        .category-title { font-size: 28px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
        .carousel { display: flex; overflow-x: auto; gap: 30px; padding: 20px 0; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }

        .card { flex: 0 0 var(--card-w); width: var(--card-w); position: relative; }
        .card img { width: 100%; height: var(--card-h); object-fit: cover; border-radius: 10px; background: #222; }
        .card.landscape { flex: 0 0 380px; width: 380px; }
        .card.landscape img { height: 215px; }
        .card-name { margin-top: 15px; font-size: 20px; text-align: center; color: #bbb; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        /* --- DETAILS OVERLAY --- */
        #details-overlay {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 3500; display: none; flex-direction: column;
        }
        .details-hero { height: 65vh; width: 100%; position: relative; }
        #details-header-bg { position: absolute; inset: 0; background-size: cover; background-position: center 20%; }
        .details-hero::after { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to top, var(--bg) 15%, transparent); 
        }
        .details-info { padding: 0 var(--tv-padding); margin-top: -180px; position: relative; z-index: 5; }
        .details-info h2 { font-size: 70px; margin: 0 0 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .synopsis { font-size: 24px; color: #ccc; max-width: 1100px; line-height: 1.6; margin-bottom: 40px; }
        .details-actions { display: flex; gap: 25px; }
        .btn-play-main { 
            background: white; color: black; border: none; padding: 25px 60px; 
            border-radius: 10px; font-size: 28px; font-weight: bold; cursor: pointer; 
            display: flex; align-items: center; gap: 15px;
        }

        /* --- PLAYER --- */
        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
        .video-js { width: 100vw !important; height: 100vh !important; }

        /* Banner d'expiration */
        #expiration-banner { 
            position: fixed; bottom: 0; width: 100%; background: var(--gold); 
            color: black; text-align: center; font-weight: bold; padding: 15px; z-index: 2500; display: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<!-- ECRAN CONNEXION -->
<div id="login-screen">
    <form class="login-box" onsubmit="event.preventDefault(); checkLogin();">
        <div class="logo" style="margin-bottom:40px; font-size: 60px;">SFPP ELITE</div>
        <input type="email" id="user" placeholder="E-mail" tabindex="0" required>
        <input type="password" id="pass" placeholder="Mot de passe" tabindex="0" required>
        <button type="submit" tabindex="0">CONNEXION</button>
        <p style="color: #666; margin-top: 20px; font-size: 18px;">Contactez sfpp.ott@gmail.com pour un accès.</p>
    </form>
</div>

<!-- ECRAN PROFILS -->
<div id="profile-screen" style="display:none;">
    <h1 style="font-size: 45px; margin-bottom: 30px;">Qui regarde ?</h1>
    <div class="profile-grid" id="profile-list"></div>
    <button onclick="logout()" style="margin-top: 50px; background:none; border: 1px solid #444; color:#666; padding:15px; border-radius:8px;" tabindex="0">DÉCONNEXION</button>
</div>

<!-- HEADER NAVIGATION -->
<header id="app-header" style="display:none;">
    <div class="logo">SFPP</div>
    <div class="nav-links">
        <button class="nav-btn active" id="btn-all" onclick="changeView('all')" tabindex="0">Accueil</button>
        <button class="nav-btn" id="btn-movies" onclick="changeView('movies')" tabindex="0">Films</button>
        <button class="nav-btn" id="btn-series" onclick="changeView('series')" tabindex="0">Séries</button>
        <button class="nav-btn" id="btn-fav" onclick="changeView('fav')" tabindex="0">Ma Liste ❤️</button>
        <button class="nav-btn" onclick="location.reload()" tabindex="0">🔄</button>
    </div>
    <button class="nav-btn" onclick="switchProfile()" tabindex="0" style="font-size: 18px; border: 1px solid #444;">PROFILS</button>
</header>

<!-- CONTENU PRINCIPAL -->
<main id="main-content" style="display:none;">
    <div id="expiration-banner"></div>
    <div id="categories-container"></div>
</main>

<!-- MODAL DETAILS -->
<div id="details-overlay">
    <div class="details-hero"><div id="details-header-bg"></div></div>
    <div class="details-info">
        <h2 id="details-title">Titre du contenu</h2>
        <p id="details-desc" class="synopsis"></p>
        <div class="details-actions">
            <button id="details-play-btn" class="btn-play-main" tabindex="0">▶ LANCER LE FILM</button>
            <button id="details-fav-btn" class="nav-btn" style="border: 2px solid white;" tabindex="0">+ MA LISTE</button>
            <button onclick="closeDetails()" class="nav-btn" tabindex="0">RETOUR</button>
        </div>
    </div>
</div>

<!-- LECTEUR VIDÉO -->
<section id="player-section">
    <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="auto"></video>
</section>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script type="module">
    // --- CONFIGURATION FIREBASE (REPRISE DE TON CODE) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDipnvk8nHn_mnj6HObA038DhS2U39kSgU",
      authDomain: "sfpp-elite.firebaseapp.com",
      databaseURL: "https://sfpp-elite-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sfpp-elite"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.checkLogin = function() {
        const email = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, email, pass).catch(() => alert("Erreur d'identification."));
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('profile-screen').style.display = 'flex';
            initProfiles();
            checkExpiration(user.uid);
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    async function checkExpiration(uid) {
        const snap = await get(ref(db, 'users_data/' + uid + '/expire'));
        if (snap.exists()) {
            const expireDate = new Date(snap.val());
            const diff = Math.ceil((expireDate - new Date()) / (1000 * 60 * 60 * 24));
            if (diff <= 5 && diff > 0) {
                const banner = document.getElementById('expiration-banner');
                banner.style.display = 'block';
                banner.innerText = `⚠️ Votre abonnement expire dans ${diff} jours.`;
            }
        }
    }

    window.logout = () => signOut(auth).then(() => location.reload());
</script>

<script>
let player, playlistData = [], currentProfile = null, currentView = 'all';

// --- NAVIGATION TÉLÉCOMMANDE (D-PAD) ---
document.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    switch(e.keyCode) {
        case 13: // OK
            if (active) active.click();
            break;
        case 8:  // Retour Android
        case 27: // Echap
        case 10009: // Retour Tizen
            e.preventDefault();
            handleBackNavigation();
            break;
    }
});

function handleBackNavigation() {
    if (document.getElementById('player-section').style.display === 'block') {
        closeP();
    } else if (document.getElementById('details-overlay').style.display === 'flex') {
        closeDetails();
    } else {
        if (confirm("Voulez-vous quitter l'application ?")) {
            window.close();
        }
    }
}

// --- GESTION DES PROFILS ---
function initProfiles() {
    const list = document.getElementById('profile-list');
    const profiles = [
        { id: 1, name: "Principal", icon: "👤", color: "#e50914" },
        { id: 2, name: "Famille", icon: "👨‍👩‍👧", color: "#1e90ff" },
        { id: 3, name: "Enfants", icon: "👶", color: "#2ecc71" }
    ];
    list.innerHTML = profiles.map(p => `
        <div class="profile-item" onclick="selectProfile('${p.name}')" tabindex="0">
            <div class="profile-avatar" style="background:${p.color}">${p.icon}</div>
            <div class="profile-name">${p.name}</div>
        </div>
    `).join('');
    setTimeout(() => document.querySelector('.profile-item').focus(), 300);
}

function selectProfile(name) {
    currentProfile = name;
    document.getElementById('profile-screen').style.display = 'none';
    document.getElementById('app-header').style.display = 'flex';
    document.getElementById('main-content').style.display = 'block';
    loadData();
}

async function loadData() {
    const res = await fetch('films.json?v=' + Date.now());
    playlistData = await res.json();
    render();
    setTimeout(() => document.getElementById('btn-all').focus(), 100);
}

// --- RENDU TV ---
function render() {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    
    let filtered = playlistData;
    if (currentView === 'movies') filtered = playlistData.filter(m => !m.cat.includes("SÉRIES"));
    if (currentView === 'series') filtered = playlistData.filter(m => m.cat.includes("SÉRIES"));

    const genres = [...new Set(filtered.map(m => m.cat.split(',')[0].trim()))];

    genres.forEach(genre => {
        const items = filtered.filter(m => m.cat.includes(genre));
        if (items.length === 0) return;

        let html = `<div class="category-row">
            <div class="category-title">${genre}</div>
            <div class="carousel">`;
        
        items.forEach(m => {
            const isTV = m.cat.includes("DIRECT") || m.cat.includes("TV");
            html += `
                <div class="card ${isTV ? 'landscape' : ''}" tabindex="0" onclick="openDetails(${playlistData.indexOf(m)})">
                    <img src="${m.img}" loading="lazy">
                    <div class="card-name">${m.t}</div>
                </div>`;
        });
        
        html += `</div></div>`;
        cont.innerHTML += html;
    });
}

// --- ACTIONS ---
function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('details-header-bg').style.backgroundImage = `url('${m.bg || m.img}')`;
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-desc').innerText = m.desc || "Aucune description disponible pour ce titre.";
    document.getElementById('details-overlay').style.display = 'flex';
    
    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
    
    const favs = JSON.parse(localStorage.getItem('fav_' + currentProfile) || "[]");
    const favBtn = document.getElementById('details-fav-btn');
    favBtn.innerText = favs.includes(m.t) ? "❤️ DÉJÀ DANS MA LISTE" : "+ MA LISTE";
    favBtn.onclick = () => {
        let f = JSON.parse(localStorage.getItem('fav_' + currentProfile) || "[]");
        if(f.includes(m.t)) f = f.filter(x => x !== m.t); else f.push(m.t);
        localStorage.setItem('fav_' + currentProfile, JSON.stringify(f));
        openDetails(idx);
    };

    setTimeout(() => document.getElementById('details-play-btn').focus(), 100);
}

function playMovie(idx) {
    const m = playlistData[idx];
    document.getElementById('player-section').style.display = 'block';
    
    let url = m.url;
    try { url = window.atob(m.url); } catch(e) {}

    player.src({ 
        src: url, 
        type: url.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4' 
    });
    
    const savedTime = JSON.parse(localStorage.getItem('progress_' + currentProfile) || "{}")[m.t];
    if (savedTime) player.currentTime(savedTime);
    
    player.play();
    setTimeout(() => document.getElementById('main-video_html5_api').focus(), 500);
}

function closeP() {
    const cur = player.currentTime();
    const tit = playlistData.find(m => player.currentSrc().includes(m.url))?.t;
    if (tit) {
        let p = JSON.parse(localStorage.getItem('progress_' + currentProfile) || "{}");
        p[tit] = cur;
        localStorage.setItem('progress_' + currentProfile, JSON.stringify(p));
    }
    player.pause();
    document.getElementById('player-section').style.display = 'none';
}

function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }
function changeView(v) { 
    currentView = v; 
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-'+v).classList.add('active');
    render();
}
function switchProfile() { location.reload(); }

document.addEventListener('DOMContentLoaded', () => {
    player = videojs('main-video');
});
</script>
</body>
</html>
