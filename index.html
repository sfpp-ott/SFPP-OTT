<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - MA LISTE COMPLÈTE</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SFPP ELITE">
    <meta name="theme-color" content="#050505">

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { --accent: #e50914; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; overflow-x: hidden; }
        
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #111; padding: 30px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #333; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }

        #profile-screen { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .profile-item { text-align: center; cursor: pointer; }
        .profile-avatar { width: 100px; height: 100px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; border: 3px solid transparent; }
        .profile-item:hover .profile-avatar { border-color: white; }

        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.9); display: flex; align-items: center; padding: 0 20px; z-index: 2000; box-sizing: border-box; justify-content: space-between; }
        .logo { color: var(--accent); font-weight: 900; font-size: 20px; }
        
        #main-content { padding-top: 80px; }
        .category-title { font-size: 18px; font-weight: bold; margin: 20px 4%; }
        .carousel { display: flex; overflow-x: auto; gap: 15px; padding: 0 4%; scrollbar-width: none; }
        .card { flex: 0 0 150px; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 225px; object-fit: cover; border-radius: 4px; }
        .card-name { font-size: 12px; margin-top: 5px; text-align: center; color: #ccc; }

        #details-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3500; display: none; flex-direction: column; overflow-y: auto; }
        .details-hero { width: 100%; height: 40vh; background-size: cover; background-position: center; position: relative; }
        .details-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg), transparent); }
        .details-info { padding: 20px 5%; }
        .btn-play { background: white; color: black; border: none; padding: 15px 30px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }

        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
        .video-js { width: 100% !important; height: 100% !important; }
        .close-p { position: absolute; top: 20px; left: 20px; z-index: 6000; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="logo" style="margin-bottom:20px">SFPP ELITE</div>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="pass" placeholder="Mot de passe">
        <button onclick="checkLogin()">CONNEXION</button>
    </div>
</div>

<div id="profile-screen">
    <h1>Qui regarde ?</h1>
    <div class="profile-grid">
        <div class="profile-item" onclick="selectProfile('Utilisateur', '👤')">
            <div class="profile-avatar">👤</div>
            <div class="profile-name">Utilisateur</div>
        </div>
    </div>
</div>

<header>
    <div class="logo">SFPP ELITE</div>
    <button onclick="logout()" style="background:none; border:none; color:white; cursor:pointer;">Déconnexion</button>
</header>

<div id="details-overlay">
    <button class="close-p" onclick="closeDetails()" style="left:auto; right:20px;">✕</button>
    <div id="det-hero" class="details-hero"></div>
    <div class="details-info">
        <h2 id="det-title"></h2>
        <button id="det-play-btn" class="btn-play">▶ Lecture</button>
        <p id="det-desc" style="margin-top:20px; color:#aaa;"></p>
    </div>
</div>

<section id="player-section">
    <button class="close-p" onclick="closeP()">✕</button>
    <video id="main-video" class="video-js vjs-theme-fantasy" controls preload="auto"></video>
</section>

<div id="main-content">
    <div id="categories-container"></div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDipnvk8nHn_mnj6HObA038DhS2U39kSgU",
      authDomain: "sfpp-elite.firebaseapp.com",
      databaseURL: "https://sfpp-elite-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sfpp-elite"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.checkLogin = function() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, e, p).catch(err => alert("Erreur: " + err.message));
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            loadPlaylist();
            if(localStorage.getItem('sfpp_profile')) {
                document.getElementById('profile-screen').style.display = 'none';
            } else {
                document.getElementById('profile-screen').style.display = 'flex';
            }
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.selectProfile = function(n) {
        localStorage.setItem('sfpp_profile', n);
        document.getElementById('profile-screen').style.display = 'none';
    };

    window.logout = function() { signOut(auth).then(() => { localStorage.clear(); location.reload(); }); };
</script>

<script>
let player, playlistData = [];

async function loadPlaylist() {
    try {
        const r = await fetch('films.json?v=' + Date.now());
        playlistData = await r.json();
        render();
    } catch(e) { console.error("Erreur chargement JSON"); }
}

function render() {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    const cats = [...new Set(playlistData.map(m => m.cat))];
    cats.forEach(c => {
        let html = `<div class="category-title">${c}</div><div class="carousel">`;
        playlistData.filter(m => m.cat === c).forEach(m => {
            html += `<div class="card" onclick="openDetails(${playlistData.indexOf(m)})"><img src="${m.img}"><div class="card-name">${m.t}</div></div>`;
        });
        html += `</div>`;
        cont.innerHTML += html;
    });
}

function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('det-hero').style.backgroundImage = `url('${m.img}')`;
    document.getElementById('det-title').innerText = m.t;
    document.getElementById('det-desc').innerText = m.desc || "Pas de description.";
    document.getElementById('det-play-btn').onclick = () => playMovie(idx);
    document.getElementById('details-overlay').style.display = 'flex';
}

function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }

// --- FONCTION DE LECTURE CRITIQUE ---
function playMovie(idx) {
    const m = playlistData[idx];
    document.getElementById('details-overlay').style.display = 'none';
    document.getElementById('player-section').style.display = 'block';

    let rawUrl = "";
    try { 
        rawUrl = m.url.startsWith('http') ? m.url : atob(m.url); 
    } catch(e) { 
        rawUrl = m.url; 
    }

    // Proxy spécifique pour contourner le blocage Mixed Content (HTTP sur HTTPS)
    // On utilise un service qui force le HTTPS
    const finalUrl = "https://worker-proxy.sfpp.workers.dev/?url=" + encodeURIComponent(rawUrl);

    if (Hls.isSupported()) {
        if (window.hls) window.hls.destroy();
        const hls = new Hls({
            xhrSetup: function (xhr) {
                xhr.withCredentials = false;
            }
        });
        hls.loadSource(finalUrl);
        hls.attachMedia(document.querySelector('#main-video_html5_api'));
        hls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
        
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                console.error("Erreur HLS Fatale:", data.details);
                // Si le proxy échoue, on tente une dernière fois en direct (au cas où)
                if(data.details === 'manifestLoadError') {
                    hls.loadSource(rawUrl);
                }
            }
        });
        window.hls = hls;
    } else {
        player.src({ src: finalUrl, type: 'application/x-mpegURL' });
        player.play();
    }
}

function closeP() {
    if(window.hls) window.hls.destroy();
    player.pause();
    player.src("");
    document.getElementById('player-section').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', () => {
    player = videojs('main-video');
});
</script>
</body>
</html>
