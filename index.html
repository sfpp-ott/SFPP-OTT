<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - MA LISTE COMPLÈTE</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SFPP ELITE">
    <meta name="theme-color" content="#050505">

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">
    <link href="https://unpkg.com/@silvermine/videojs-chromecast@1.5.0/dist/silvermine-videojs-chromecast.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { --accent: #e50914; --gold: #ffcc00; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding-bottom: 50px; -webkit-user-select: none; user-select: none; }
        
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #111; padding: 30px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #333; position: relative; z-index: 10000; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-request { background: none !important; border: none; color: #666 !important; font-size: 11px; margin-top: 15px; cursor: pointer; text-decoration: underline; }

        #profile-screen { position: fixed; inset: 0; background: var(--bg); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 80%; max-width: 400px; margin-top: 30px; }
        .profile-item { text-align: center; cursor: pointer; transition: transform 0.2s; position: relative; border-radius: 8px; }
        .profile-avatar { width: 100px; height: 100px; background: #333; border-radius: 4px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid transparent; }
        .profile-name { font-size: 14px; color: #888; }
        
        header { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: rgba(0,0,0,0.95); display: flex; align-items: center; 
            padding: 0 15px; z-index: 2000; border-bottom: 1px solid #222; 
            justify-content: space-between; box-sizing: border-box; gap: 10px;
        }
        .logo { color: var(--accent); font-weight: 900; font-size: 18px; flex-shrink: 0; }
        .nav-links { display: flex; gap: 15px; flex: 1; overflow-x: auto; white-space: nowrap; align-items: center; scrollbar-width: none; }
        .nav-btn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 13px; font-weight: 500; padding: 10px 5px; }
        .nav-btn.active { color: white; font-weight: bold; border-bottom: 2px solid var(--accent); }

        #search-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 60px; background: #000; display: none; align-items: center; padding: 0 15px; box-sizing: border-box; z-index: 2001; }
        #searchBar { flex: 1; background: #222; border: 1px solid #444; color: white; padding: 8px 15px; border-radius: 20px; outline: none; font-size: 14px; }
        
        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; overflow: hidden; }
        .video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        .btn-close-player { position: absolute; top: 20px; left: 20px; z-index: 5000; background: rgba(0,0,0,0.5); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer; }

        #details-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3500; display: none; flex-direction: column; overflow-y: auto; }
        .details-hero { position: relative; width: 100%; height: 50vh; overflow: hidden; background: #000; }
        #details-header-bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 1; }
        .details-info { padding: 0 5% 40px; margin-top: -80px; position: relative; z-index: 5; }
        .btn-play-main { background: white; color: black; border: none; padding: 15px 35px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 20px; }
        
        #main-content { padding-top: 80px; }
        .category-title { font-size: 18px; font-weight: bold; margin: 20px 4% 10px; color: #fff; text-transform: uppercase; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; padding: 0 4% 10px; scrollbar-width: none; }
        .card { flex: 0 0 150px; cursor: pointer; }
        .card img { width: 150px; height: 225px; object-fit: cover; border-radius: 4px; background: #222; }
        .card-name { margin-top: 6px; font-size: 12px; text-align: center; color: #bbb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        @media (max-width: 768px) { .card { flex: 0 0 130px; } .card img { width: 130px; height: 195px; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="login-screen">
    <form class="login-box" onsubmit="event.preventDefault(); checkLogin();">
        <div class="logo" style="margin-bottom:20px">SFPP ELITE</div>
        <input type="email" id="user" placeholder="E-mail" required>
        <input type="password" id="pass" placeholder="Mot de passe" required>
        <button type="submit">CONNEXION</button>
        <button type="button" class="btn-request" onclick="requestAccess()">Demander un accès</button>
    </form>
</div>

<div id="profile-screen">
    <h1>Qui regarde ?</h1>
    <div class="profile-grid" id="profile-list"></div>
    <button onclick="logout()" style="margin-top: 20px; background:none; border:none; color:#444; cursor:pointer;">DÉCONNEXION</button>
</div>

<header>
    <div class="logo" id="header-logo">SFPP</div>
    <div class="nav-links">
        <button class="nav-btn active" onclick="changeView('all')">Accueil</button>
        <button class="nav-btn" onclick="openSearch()">🔍 Rechercher</button>
    </div>
    <div class="header-actions">
        <button class="nav-btn" onclick="switchProfile()">PROFILS</button>
    </div>
    <div id="search-overlay">
        <input type="text" id="searchBar" onkeyup="filter()" placeholder="Rechercher...">
        <button class="nav-btn" onclick="closeSearch()">✕</button>
    </div>
</header>

<div id="details-overlay">
    <button style="position:absolute; top:20px; right:20px; z-index:100; background:rgba(0,0,0,0.5); color:white; border:none; border-radius:50%; width:40px; height:40px;" onclick="closeDetails()">✕</button>
    <div class="details-hero"><div id="details-header-bg"></div></div>
    <div class="details-info">
        <h2 id="details-title" style="font-size:32px; margin-bottom:10px;"></h2>
        <button id="details-play-btn" class="btn-play-main">▶ Lancer la lecture</button>
        <p id="details-desc" style="color:#ddd; line-height:1.6;"></p>
    </div>
</div>

<section id="player-section">
    <button class="btn-close-player" onclick="closeP()">✕</button>
    <div class="video-container">
        <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="auto" width="100%" height="100%"></video>
    </div>
</section>

<div id="main-content">
    <div id="categories-container"></div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDipnvk8nHn_mnj6HObA038DhS2U39kSgU",
      authDomain: "sfpp-elite.firebaseapp.com",
      databaseURL: "https://sfpp-elite-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sfpp-elite"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.checkLogin = function() {
        const email = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, email, pass).catch(() => alert("Erreur de connexion"));
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            loadPlaylist();
            initProfiles();
            const saved = localStorage.getItem('sfpp_profile');
            if(saved) selectProfile(saved);
            else document.getElementById('profile-screen').style.display = 'flex';
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    window.logout = function() { signOut(auth).then(() => { localStorage.clear(); location.reload(); }); };
</script>

<script>
let player, playlistData = [], currentProfile = null;

async function loadPlaylist() { 
    try { 
        const res = await fetch('films.json?v=' + Date.now()); 
        playlistData = await res.json(); 
        render(); 
    } catch(e) { console.error(e); } 
}

function render(search = "") {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    const s = search.toLowerCase();
    const cats = [...new Set(playlistData.map(m => m.cat))];
    
    cats.forEach(c => {
        const filtered = playlistData.filter(m => m.cat === c && m.t.toLowerCase().includes(s));
        if (filtered.length === 0) return;
        let html = `<div class="category-title">${c}</div><div class="carousel">`;
        filtered.forEach(m => {
            html += `<div class="card" onclick="openDetails(${playlistData.indexOf(m)})"><img src="${m.img}"><div class="card-name">${m.t}</div></div>`;
        });
        html += `</div>`;
        cont.innerHTML += html;
    });
}

function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('details-header-bg').style.backgroundImage = `url('${m.img}')`;
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-desc').innerText = m.desc || "Aucun résumé.";
    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
    document.getElementById('details-overlay').style.display = 'flex';
}

function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }

function playMovie(idx) {
    const m = playlistData[idx];
    const pSection = document.getElementById('player-section');
    pSection.style.display = 'block';
    
    let url = "";
    try { url = m.url.startsWith('http') ? m.url : atob(m.url); } catch(e) { url = m.url; }

    // Utilisation d'un proxy plus simple ou direct
    const finalUrl = "https://corsproxy.io/?" + encodeURIComponent(url);

    if (url.includes('.m3u8')) {
        if (Hls.isSupported()) {
            if (window.hls) window.hls.destroy();
            const hls = new Hls();
            hls.loadSource(finalUrl);
            hls.attachMedia(document.querySelector('#main-video_html5_api'));
            hls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
            window.hls = hls;
        } else {
            player.src({ src: finalUrl, type: 'application/x-mpegURL' });
            player.play();
        }
    } else {
        player.src({ src: finalUrl, type: 'video/mp4' });
        player.play();
    }
}

function closeP() { 
    if(window.hls) window.hls.destroy();
    player.pause(); 
    player.src(""); 
    document.getElementById('player-section').style.display = 'none'; 
}

function initProfiles() {
    const profiles = [{name:"Utilisateur", icon:"👤", color:"#333"}];
    document.getElementById('profile-list').innerHTML = profiles.map(p => `
        <div class="profile-item" onclick="selectProfile('${p.name}')">
            <div class="profile-avatar" style="background:${p.color}">${p.icon}</div>
            <div class="profile-name">${p.name}</div>
        </div>`).join('');
}

function selectProfile(n) { currentProfile = n; localStorage.setItem('sfpp_profile', n); document.getElementById('profile-screen').style.display='none'; }
function switchProfile() { localStorage.removeItem('sfpp_profile'); location.reload(); }
function openSearch() { document.getElementById('search-overlay').style.display = 'flex'; }
function closeSearch() { document.getElementById('search-overlay').style.display = 'none'; render(); }
function filter() { render(document.getElementById('searchBar').value); }
function requestAccess() { window.location.href = "mailto:sfpp.ott@gmail.com"; }

document.addEventListener('DOMContentLoaded', () => { player = videojs('main-video'); });
</script>
</body>
</html>
