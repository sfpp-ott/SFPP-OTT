<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFPP ELITE - VERSION FINALE</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">

    <style>
        :root { --accent: #e50914; --gold: #ffcc00; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding-bottom: 50px; user-select: none; -webkit-user-select: none; }

        /* --- LE SECRET DE LA TV : UN FOCUS NET ET ÉLÉGANT --- */
        [tabindex="0"]:focus {
            outline: 3px solid white !important;
            outline-offset: 3px;
            transform: scale(1.05);
            background: rgba(255,255,255,0.1);
            z-index: 100;
        }

        /* --- LOGIN & PROFILES (REPRISE DE TON DESIGN) --- */
        #login-screen, #profile-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: #111; padding: 40px; border-radius: 8px; width: 320px; text-align: center; border: 1px solid #333; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }

        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .profile-avatar { width: 110px; height: 110px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 45px; border: 3px solid transparent; transition: 0.3s; }
        .profile-name { font-size: 14px; color: #888; margin-top: 10px; text-align: center; }

        /* --- HEADER --- */
        header { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: rgba(0,0,0,0.95); display: flex; align-items: center; 
            padding: 0 20px; z-index: 2000; border-bottom: 1px solid #222; 
            justify-content: space-between; box-sizing: border-box;
        }
        .logo { color: var(--accent); font-weight: 900; font-size: 20px; }
        .nav-links { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; flex: 1; margin-left: 20px; }
        .nav-btn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 14px; font-weight: bold; white-space: nowrap; padding: 10px 5px; }
        .nav-btn.active { color: white; border-bottom: 2px solid var(--accent); }

        /* --- BANNER VALIDITÉ --- */
        #expiration-banner { display: none; background: var(--gold); color: #000; text-align: center; padding: 8px; font-size: 13px; font-weight: bold; position: fixed; top: 60px; width: 100%; z-index: 1500; }

        /* --- CARROUSELS (L'ADN DE TON APP) --- */
        #main-content { padding-top: 80px; }
        .category-title { font-size: 18px; font-weight: bold; margin: 20px 4% 10px; color: #fff; text-transform: uppercase; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; padding: 0 4% 20px; scrollbar-width: none; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .carousel::-webkit-scrollbar { display: none; }

        .card { flex: 0 0 150px; width: 150px; position: relative; cursor: pointer; transition: 0.3s; }
        .card img { width: 100%; height: 225px; object-fit: cover; border-radius: 4px; background: #222; }
        .card.landscape { flex: 0 0 180px; width: 180px; }
        .card.landscape img { height: 110px; object-fit: contain; background: #111; border: 1px solid #333; }
        .card-name { margin-top: 6px; font-size: 12px; text-align: center; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Progress Bar sur Card */
        .prog-bg { position: absolute; bottom: 25px; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.2); }
        .prog-fill { height: 100%; background: var(--accent); }

        /* --- DETAILS OVERLAY (LE DESIGN PREMIUM) --- */
        #details-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3500; display: none; overflow-y: auto; flex-direction: column; }
        .details-hero { position: relative; width: 100%; height: 55vh; overflow: hidden; }
        #details-header-bg { position: absolute; inset: 0; background-size: cover; background-position: center 20%; filter: brightness(0.6); }
        .details-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 10%, transparent); }
        
        .details-info { padding: 0 5% 50px; margin-top: -100px; position: relative; z-index: 5; }
        .details-info h2 { font-size: 40px; font-weight: bold; margin-bottom: 10px; }
        .meta { color: #888; font-size: 14px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        .synopsis { color: #ddd; line-height: 1.6; font-size: 16px; max-width: 800px; margin-bottom: 30px; }

        .btn-play-main { background: white; color: black; border: none; padding: 15px 35px; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .btn-fav { background: rgba(255,255,255,0.1); color: white; border: 1px solid #444; padding: 15px 25px; border-radius: 4px; cursor: pointer; }

        /* --- PLAYER --- */
        #player-section { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; }
        .vjs-blur-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(50px) brightness(0.3); transform: scale(1.1); }
        .video-js { width: 100% !important; height: 100% !important; z-index: 1; }

        @media (max-width: 768px) {
            .card { flex: 0 0 130px; width: 130px; }
            .card img { height: 195px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="login-screen">
    <div class="login-box">
        <div class="logo" style="margin-bottom:30px; font-size:30px">SFPP ELITE</div>
        <input type="email" id="user" placeholder="E-mail" tabindex="0">
        <input type="password" id="pass" placeholder="Mot de passe" tabindex="0">
        <button onclick="checkLogin()" tabindex="0">CONNEXION</button>
    </div>
</div>

<div id="profile-screen" style="display:none">
    <h1 style="font-size: 28px;">Qui regarde ?</h1>
    <div class="profile-grid" id="profile-list"></div>
</div>

<header id="app-header" style="display:none">
    <div class="logo">SFPP</div>
    <div class="nav-links">
        <button class="nav-btn active" id="btn-all" onclick="changeView('all')" tabindex="0">Accueil</button>
        <button class="nav-btn" id="btn-movies" onclick="changeView('movies')" tabindex="0">Films</button>
        <button class="nav-btn" id="btn-series" onclick="changeView('series')" tabindex="0">Séries</button>
        <button class="nav-btn" id="btn-fav" onclick="changeView('fav')" tabindex="0">Ma Liste ❤️</button>
    </div>
    <div id="validity-tag" style="font-size:10px; color:#555"></div>
</header>

<div id="expiration-banner"></div>

<main id="main-content" style="display:none">
    <div id="categories-container"></div>
</main>

<div id="details-overlay">
    <button onclick="closeDetails()" style="position:fixed; top:20px; right:20px; z-index:100; background:rgba(0,0,0,0.5); border:none; color:white; font-size:25px; width:45px; height:45px; border-radius:50%;" tabindex="0">✕</button>
    <div class="details-hero"><div id="details-header-bg"></div></div>
    <div class="details-info">
        <h2 id="details-title">Titre</h2>
        <div class="meta">
            <span id="details-year">2024</span>
            <span id="details-stars" style="color:var(--gold)"></span>
            <span id="details-cat">Action</span>
        </div>
        <p id="details-desc" class="synopsis"></p>
        <div style="display:flex; gap:15px">
            <button id="details-play-btn" class="btn-play-main" tabindex="0">▶ Lancer le film</button>
            <button id="details-fav-btn" class="btn-fav" tabindex="0">+ Ma Liste</button>
        </div>
        
        <div style="margin-top:40px">
            <div style="font-weight:bold; margin-bottom:15px; border-left:3px solid var(--accent); padding-left:10px">CASTING</div>
            <div id="details-cast" style="display:flex; gap:15px; overflow-x:auto; padding-bottom:10px"></div>
        </div>
    </div>
</div>

<section id="player-section">
    <div id="player-blur-bg" class="vjs-blur-bg"></div>
    <video id="main-video" class="video-js vjs-theme-fantasy vjs-big-play-centered" controls preload="auto"></video>
</section>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDipnvk8nHn_mnj6HObA038DhS2U39kSgU",
      authDomain: "sfpp-elite.firebaseapp.com",
      databaseURL: "https://sfpp-elite-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sfpp-elite"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.checkLogin = function() {
        const email = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Accès refusé."));
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const snap = await get(ref(db, 'users_data/' + user.uid + '/expire'));
            const expireDate = snap.val();
            if (expireDate) {
                document.getElementById('validity-tag').innerText = `FIN : ${expireDate}`;
                const diff = Math.ceil((new Date(expireDate) - new Date()) / (1000*60*60*24));
                if (diff <= 5 && diff > 0) {
                    const b = document.getElementById('expiration-banner');
                    b.style.display = 'block';
                    b.innerText = `⚠️ ACCÈS FINIT DANS ${diff} JOURS`;
                }
            }
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('profile-screen').style.display = 'flex';
            initProfiles();
            loadPlaylist();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });
</script>

<script>
let player, playlistData = [], currentProfile = null, currentView = 'all';
const TMDB_KEY = "ec1c8fecd38d1cc5a27f15766f0848d5";

// NAVIGATION TÉLÉCOMMANDE
document.addEventListener('keydown', (e) => {
    if (e.keyCode === 13 && document.activeElement) document.activeElement.click();
    if (e.keyCode === 8 || e.keyCode === 27) {
        e.preventDefault();
        if (document.getElementById('player-section').style.display === 'block') closeP();
        else if (document.getElementById('details-overlay').style.display === 'flex') closeDetails();
    }
});

async function loadPlaylist() {
    const res = await fetch('films.json?v=' + Date.now());
    const data = await res.json();
    
    // Enrichissement TMDB (Reprise exacte de ta logique)
    const promises = data.map(async (m) => {
        if (m.id_tmdb) {
            try {
                const tr = await fetch(`https://api.themoviedb.org/3/movie/${m.id_tmdb}?api_key=${TMDB_KEY}&language=fr-FR&append_to_response=credits`);
                const d = await tr.json();
                m.img = m.img || `https://image.tmdb.org/t/p/w500${d.poster_path}`;
                m.bg = m.bg || `https://image.tmdb.org/t/p/original${d.backdrop_path}`;
                m.desc = m.desc || d.overview;
                m.year = m.year || d.release_date?.split('-')[0];
                m.note = m.note || Math.round(d.vote_average / 2);
                m.cast = d.credits?.cast.slice(0, 6).map(a => ({ n: a.name, p: `https://image.tmdb.org/t/p/w185${a.profile_path}` }));
            } catch(e) {}
        }
        return m;
    });

    playlistData = await Promise.all(promises);
    render();
}

function render() {
    const cont = document.getElementById('categories-container');
    cont.innerHTML = "";
    
    let filtered = playlistData;
    if (currentView === 'movies') filtered = playlistData.filter(m => !m.cat.includes("SÉRIES"));
    if (currentView === 'series') filtered = playlistData.filter(m => m.cat.includes("SÉRIES"));
    if (currentView === 'fav') {
        const f = JSON.parse(localStorage.getItem('fav_' + currentProfile) || "[]");
        filtered = playlistData.filter(m => f.includes(m.t));
    }

    const categories = [...new Set(filtered.map(m => m.cat.split(',')[0].trim()))];

    categories.forEach(cat => {
        const items = filtered.filter(m => m.cat.includes(cat));
        if (items.length === 0) return;

        let html = `<div class="category-title">${cat}</div><div class="carousel">`;
        items.forEach(m => {
            const isTV = m.cat.includes("DIRECT");
            const prog = JSON.parse(localStorage.getItem('prog_' + currentProfile) || "{}")[m.t] || 0;
            const pct = prog > 5 ? `<div class="prog-bg"><div class="prog-fill" style="width:${prog}%"></div></div>` : "";
            
            html += `
                <div class="card ${isTV ? 'landscape' : ''}" tabindex="0" onclick="openDetails(${playlistData.indexOf(m)})">
                    <img src="${m.img}" loading="lazy">
                    ${pct}
                    <div class="card-name">${m.t}</div>
                </div>`;
        });
        cont.innerHTML += html + `</div>`;
    });
}

function openDetails(idx) {
    const m = playlistData[idx];
    document.getElementById('details-header-bg').style.backgroundImage = `url('${m.bg || m.img}')`;
    document.getElementById('details-title').innerText = m.t;
    document.getElementById('details-desc').innerText = m.desc || "Pas de résumé.";
    document.getElementById('details-year').innerText = m.year || "2024";
    document.getElementById('details-cat').innerText = m.cat;
    
    let stars = ""; for(let i=0; i<5; i++) stars += i < (m.note||5) ? "★" : "☆";
    document.getElementById('details-stars').innerText = stars;

    document.getElementById('details-cast').innerHTML = (m.cast || []).map(a => `
        <div style="flex:0 0 80px; text-align:center">
            <img src="${a.p}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid #333">
            <div style="font-size:10px; color:#aaa; margin-top:5px">${a.n}</div>
        </div>
    `).join('');

    document.getElementById('details-play-btn').onclick = () => playMovie(idx);
    
    const fBtn = document.getElementById('details-fav-btn');
    let f = JSON.parse(localStorage.getItem('fav_' + currentProfile) || "[]");
    fBtn.innerText = f.includes(m.t) ? "❤️ Retirer" : "+ Ma Liste";
    fBtn.onclick = () => {
        if(f.includes(m.t)) f = f.filter(x => x !== m.t); else f.push(m.t);
        localStorage.setItem('fav_' + currentProfile, JSON.stringify(f));
        openDetails(idx);
    };

    document.getElementById('details-overlay').style.display = 'flex';
    setTimeout(() => document.getElementById('details-play-btn').focus(), 100);
}

function playMovie(idx) {
    const m = playlistData[idx];
    document.getElementById('player-section').style.display = 'block';
    document.getElementById('player-blur-bg').style.backgroundImage = `url('${m.bg || m.img}')`;
    let url = m.url; try { url = window.atob(m.url); } catch(e) {}

    player.src({ src: url, type: url.includes('m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
    player.play();
    
    player.on('timeupdate', () => {
        const p = (player.currentTime() / player.duration()) * 100;
        if (p > 2) {
            let s = JSON.parse(localStorage.getItem('prog_' + currentProfile) || "{}");
            s[m.t] = p; localStorage.setItem('prog_' + currentProfile, JSON.stringify(s));
        }
    });
}

function closeP() { player.pause(); document.getElementById('player-section').style.display = 'none'; render(); }
function closeDetails() { document.getElementById('details-overlay').style.display = 'none'; }
function initProfiles() {
    const profs = [{n:"Elite", i:"💎"}, {n:"Kids", i:"🍭"}];
    document.getElementById('profile-list').innerHTML = profs.map(p => `
        <div class="profile-item" onclick="selectProfile('${p.n}')" tabindex="0">
            <div class="profile-avatar">${p.i}</div>
            <div class="profile-name">${p.n}</div>
        </div>`).join('');
}
function selectProfile(n) { currentProfile = n; document.getElementById('profile-screen').style.display = 'none'; document.getElementById('app-header').style.display = 'flex'; document.getElementById('main-content').style.display = 'block'; }
function changeView(v) { currentView = v; document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+v).classList.add('active'); render(); }

document.addEventListener('DOMContentLoaded', () => { player = videojs('main-video'); });
</script>
</body>
</html>
